name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci apps packages scripts
      - run: node scripts/check-agent-context.mjs
      - run: node scripts/verify-repository.mjs
      - run: node scripts/run-vitest.mjs run scripts
