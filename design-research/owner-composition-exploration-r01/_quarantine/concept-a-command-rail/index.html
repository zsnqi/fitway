<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FITWAY Owner — Concept A: Command Rail (design exploration, not authority)</title>
<meta name="description" content="Standalone interactive Owner composition concept. Concept fixture only — not production, not authority.">
<style>
/* FITWAY token baseline (DESIGN_GUIDE §14) */
:root{
  color-scheme:dark;
  --fw-obsidian:#08090a; --fw-coal:#101012; --fw-graphite:#1a1a1e;
  --fw-oxblood:#4d0713; --fw-red:#e51935; --fw-red-bright:#ff2946;
  --fw-chalk:#f5f3f2; --fw-muted:#c9c3c4; --fw-text-subtle:#aaa4a6;
  --fw-live:#4be29b; --fw-delayed:#d9a400; --fw-offline:#9aa0aa;
  --fw-space-1:4px; --fw-space-2:8px; --fw-space-3:12px; --fw-space-4:16px;
  --fw-space-6:24px; --fw-space-8:32px; --fw-space-12:48px; --fw-space-18:72px;
  --fw-radius-control:8px; --fw-radius-surface:16px; --fw-radius-board:28px;
  --fw-duration-fast:120ms; --fw-duration-base:180ms;
  --fw-ease-out:cubic-bezier(0,0,.2,1);
  --rail-w:288px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fw-obsidian); color:var(--fw-chalk);
  font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
  font-variant-numeric:tabular-nums; line-height:1.55;
  min-height:100vh; min-height:100svh;
}
/* static atmosphere only — no animation per guide */
body::before{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(900px 520px at 82% -8%, rgba(229,25,53,.16), transparent 62%),
    radial-gradient(760px 480px at 8% 12%, rgba(77,7,19,.55), transparent 60%),
    linear-gradient(180deg,#0b0c0e 0%, #08090a 60%);
}
body::after{
  content:"FITWAY"; position:fixed; inset-inline:0; bottom:-4vw; z-index:-1;
  text-align:center; font-weight:700; font-size:18vw; letter-spacing:.04em;
  color:rgba(245,243,242,.022); pointer-events:none; user-select:none;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fw-red-bright); outline-offset:3px; border-radius:6px}
.skip{position:absolute; inset-inline-start:12px; top:-60px; z-index:50; background:var(--fw-chalk); color:#111; padding:10px 16px; border-radius:8px; transition:top var(--fw-duration-fast) var(--fw-ease-out)}
.skip:focus{top:12px; color:#111}
.concept-banner{
  border-bottom:1px solid #2a2a30; background:#141316; color:var(--fw-muted);
  font-size:12.5px; padding:8px 16px; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap;
}
.concept-banner strong{color:var(--fw-chalk)}
.shell{max-width:1440px; margin:0 auto; padding:20px clamp(12px,3vw,32px) 72px;}
.topbar{display:flex; align-items:center; gap:14px; padding:14px 0 18px;}
.brand{display:flex; align-items:center; gap:12px; font-weight:700; letter-spacing:.12em}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--fw-red),#7a0b1c);display:grid;place-items:center;font-size:15px;font-weight:700}
.brand small{display:block; letter-spacing:0; font-weight:500; color:var(--fw-muted); font-size:12px}
.topbar-spacer{flex:1}
.pill{display:inline-flex; align-items:center; gap:8px; border:1px solid #2c2c33; background:#151518; border-radius:999px; padding:7px 12px; font-size:13px; color:var(--fw-muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fw-live); box-shadow:0 0 0 4px rgba(75,226,155,.14)}
.dot.stale{background:var(--fw-delayed); box-shadow:0 0 0 4px rgba(217,164,0,.15)}
.btn{border:1px solid #33333b; background:#1c1c21; border-radius:var(--fw-radius-control); padding:10px 14px; min-height:44px; cursor:pointer; transition:border-color var(--fw-duration-fast) var(--fw-ease-out), transform var(--fw-duration-fast) var(--fw-ease-out), background var(--fw-duration-fast) var(--fw-ease-out)}
.btn:hover{border-color:var(--fw-red); transform:translateY(-1px)}
.btn.primary{background:var(--fw-red); border-color:var(--fw-red); color:#fff; font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{border-color:#5c1f28; color:#ffb3bd}
.btn.small{min-height:36px; padding:6px 10px; font-size:13px}
.layout{display:grid; grid-template-columns:var(--rail-w) minmax(0,1fr); gap:20px; align-items:start}
.rail{position:sticky; top:16px; background:rgba(16,16,18,.92); border:1px solid #26262c; border-radius:20px; padding:14px}
.rail h2{font-size:12px; letter-spacing:.14em; color:var(--fw-text-subtle); margin:4px 6px 10px}
.nav-list{display:grid; gap:6px; margin:0; padding:0; list-style:none}
.nav-btn{width:100%; display:flex; gap:12px; align-items:flex-start; text-align:start; background:transparent; border:1px solid transparent; border-radius:12px; padding:11px 12px; min-height:56px; cursor:pointer}
.nav-btn:hover{background:#1b1b20}
.nav-btn[aria-current="page"]{background:#211318; border-color:#3d222a}
.nav-ico{width:34px;height:34px; flex:none; border-radius:10px; display:grid; place-items:center; background:#222228; border:1px solid #2e2e36}
.nav-btn[aria-current="page"] .nav-ico{background:var(--fw-red); border-color:var(--fw-red); color:#fff}
.nav-t{font-weight:600; font-size:14.5px}
.nav-d{font-size:12px; color:var(--fw-text-subtle)}
.nav-badge{margin-inline-start:auto; font-size:11px; border:1px solid #34343c; border-radius:999px; padding:2px 8px; color:var(--fw-muted); align-self:center}
.nav-badge.alert{color:#ffd9a0; border-color:#6b3a12; background:rgba(217,164,0,.12)}
.nav-badge.ok{color:#9df0c6; border-color:#1f4d3a; background:rgba(75,226,155,.1)}
.rail-foot{margin-top:12px; border-top:1px solid #242429; padding-top:12px; display:grid; gap:8px; font-size:12.5px; color:var(--fw-muted)}
.board{background:#121215; border:1px solid #2a2a31; border-radius:var(--fw-radius-board); overflow:hidden; position:relative}
.board::before{content:""; position:absolute; inset-inline:0; top:0; height:3px; background:linear-gradient(90deg,transparent,var(--fw-red),transparent)}
.board-head{padding:22px clamp(16px,2.6vw,30px) 6px}
.eyebrow{font-size:12px; letter-spacing:.16em; color:var(--fw-text-subtle); font-weight:600}
h1.surface-title{margin:6px 0 4px; font-size:clamp(24px,3vw,34px)}
.sub{color:var(--fw-muted); margin:0 0 6px; max-width:72ch}
.meta-row{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px}
.board-body{padding:10px clamp(16px,2.6vw,30px) 26px; display:grid; gap:16px}
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.kpi{background:#131316; border:1px solid #26262c; border-radius:16px; padding:14px 15px}
.kpi label{font-size:12.5px; color:var(--fw-text-subtle); display:block}
.kpi strong{font-size:26px; display:block; margin-top:2px}
.kpi span{font-size:12.5px; color:var(--fw-muted)}
.grid2{display:grid; grid-template-columns:1.55fr 1fr; gap:12px}
.panel{background:#121215; border:1px solid #25252b; border-radius:16px; padding:16px}
.panel h3{margin:0 0 4px; font-size:16px}
.panel p.hint{margin:0 0 12px; font-size:13px; color:var(--fw-muted)}
.bars28{display:grid; grid-template-columns:repeat(28,1fr); gap:3px; direction:ltr; margin:10px 0 6px}
.bars28 i{display:block; height:34px; border-radius:3px; background:#26262c}
.bars28 i.done{background:#4d0713}
.bars28 i.now{background:var(--fw-red-bright); box-shadow:0 0 0 1px rgba(255,41,70,.5)}
.legend{display:flex; flex-wrap:wrap; gap:8px 14px; font-size:12.5px; color:var(--fw-muted)}
svg.chart{width:100%; height:220px; display:block; background:#0d0d10; border:1px solid #232329; border-radius:12px}
.table-wrap{overflow:auto; border:1px solid #26262c; border-radius:12px; background:#0f0f12}
table.data{border-collapse:collapse; width:100%; min-width:640px; font-size:13.5px}
table.data th,table.data td{padding:10px 12px; border-bottom:1px solid #202026; text-align:start}
table.data thead th{background:#151519; font-size:12px; color:var(--fw-muted)}
.status{display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding:3px 10px; font-size:12.5px; border:1px solid #333}
.status.live{color:var(--fw-live); border-color:#1f4d3a; background:rgba(75,226,155,.08)}
.status.delayed{color:var(--fw-delayed); border-color:#5d4a12; background:rgba(217,164,0,.1)}
.status.closed{color:var(--fw-offline); border-color:#33333b; background:rgba(154,160,170,.08)}
.status.crit{color:#ff8f9d; border-color:#5c1f28; background:rgba(229,25,53,.1)}
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:end}
.field{display:grid; gap:6px; font-size:13px; color:var(--fw-muted)}
.input{background:#0f0f13; border:1px solid #2d2d34; border-radius:var(--fw-radius-control); color:var(--fw-chalk); padding:10px 12px; min-height:44px; min-width:180px; font:inherit}
textarea.input{min-height:84px; min-width:min(420px,100%)}
.form-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.notice{border:1px solid #2b2b32; border-inline-start:3px solid var(--fw-red); background:#151318; border-radius:12px; padding:12px 14px; font-size:13.5px; color:var(--fw-muted)}
.dialog-back{position:fixed; inset:0; background:rgba(0,0,0,.62); display:none; place-items:center; padding:18px; z-index:60}
.dialog-back.open{display:grid}
.dialog{width:min(520px,100%); background:#141417; border:1px solid #2e2e36; border-radius:18px; padding:20px}
.dialog-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap}
.toast-region{position:fixed; bottom:18px; inset-inline:0; display:grid; justify-items:center; z-index:70; pointer-events:none}
.toast{background:#171318; border:1px solid #3d222a; border-radius:12px; padding:10px 16px; font-size:13.5px; opacity:0}
.toast.show{opacity:1}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.skeleton{border-radius:12px; background:#1a1a20; min-height:64px; border:1px solid #232329}
@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:860px){.layout{grid-template-columns:1fr}.rail{position:static; order:2}.nav-list{display:flex; overflow-x:auto; gap:8px; padding-bottom:6px}.nav-btn{min-width:210px}#operations-main{order:1}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="skip" href="#operations-main" data-i18n="skip">تخطَّ إلى المحتوى</a>
<div class="concept-banner"><strong>CONCEPT FIXTURE</strong><span data-i18n="banner">نموذج تصوّري مستقل — ليس إنتاجًا ولا مرجعية معتمدة. كل الأرقام افتراضية للتجربة فقط.</span></div>
<div class="shell">
<header class="topbar">
<div class="brand"><span class="brand-mark">F</span><span>FITWAY<small data-i18n="ownerConsole">وحدة تحكم المالك · تجربة مفهوم</small></span></div>
<div class="topbar-spacer"></div>
<span class="pill"><span class="dot" id="liveDot"></span><bdi id="liveLabel">مباشر · آخر تحديث قبل 40 ثانية</bdi></span>
<button class="btn small" id="langToggle" aria-label="Switch language">EN</button>
<button class="btn small ghost" id="motionToggle" aria-pressed="false">تقليل الحركة: مغلق</button>
</header>
<div class="layout">
<nav class="rail" aria-label="Owner" id="ownerNav"></nav>
<main id="operations-main" tabindex="-1" aria-live="off">
<section id="surfaceRoot" aria-label="Owner surface"></section>
</main>
</div>
</div>
<script>
"use strict";
const STR={
ar:{skip:"تخطَّ إلى المحتوى",banner:"نموذج تصوّري مستقل — ليس إنتاجًا ولا مرجعية معتمدة. كل الأرقام افتراضية للتجربة فقط.",ownerConsole:"وحدة تحكم المالك · تجربة مفهوم",live:"مباشر · آخر تحديث قبل 40 ثانية",navTitle:"أقسام المالك",surfaces:{daily:["اليومي","الذروة والتغطية والمنحنى"],reports:["التقارير","الخريطة الحرارية والمقارنة"],access:["الوصول","رمز الموظفين والمالكون"],activity:["سجل النشاط","من فعل ماذا ولماذا"],health:["حالة النظام","التشغيل والأعطال"],settings:["الإعدادات","السعة والحدود والجدول"],overview:["نظرة عامة","الصالة الآن أولًا"]}},
en:{skip:"Skip to content",banner:"Standalone concept fixture — not production, not authority. All figures are illustrative fixtures.",ownerConsole:"Owner console · concept test",live:"Live · updated 40s ago",navTitle:"Owner sections",surfaces:{daily:["Daily","Peak, coverage, curve"],reports:["Reports","Heatmap and compare"],access:["Access","Staff PIN and owners"],activity:["Activity log","Who did what, why"],health:["System status","Uptime and incidents"],settings:["Settings","Capacity, bands, hours"],overview:["Overview","The gym right now"]}}
};
let locale="ar";
const ORDER=["overview","daily","reports","access","activity","health","settings"];
let route="overview";
const ICONS={overview:"◉",daily:"〜",reports:"▦",access:"⚿",activity:"≡",health:"♥",settings:"⚙"};
const BADGES={overview:"",daily:"",reports:"",access:"",activity:"",health:"!",settings:""};
function t(path){return path.split(".").reduce((o,k)=>o&&o[k],STR[locale]);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function renderNav(){
const nav=document.getElementById("ownerNav");
let h="<h2>"+esc(STR[locale].navTitle)+"</h2><ul class='nav-list'>";
ORDER.forEach(k=>{
const s=STR[locale].surfaces[k];
const cur=k===route?" aria-current='page'":"";
const b=BADGES[k]?`<span class='nav-badge ${k==="health"?"alert":"ok"}'>${k==="health"?"1":"•"}</span>`:"";
h+=`<li><button class='nav-btn' data-route='${k}'${cur}><span class='nav-ico' aria-hidden='true'>${ICONS[k]}</span><span><span class='nav-t'>${esc(s[0])}</span><br><span class='nav-d'>${esc(s[1])}</span></span>${b}</button></li>`;
});
h+="</ul><div class='rail-foot'><span>Asia/Riyadh · 06:00–23:00</span><span>v124 · append-only</span></div>";
nav.innerHTML=h;
nav.querySelectorAll("[data-route]").forEach(b=>b.addEventListener("click",()=>{route=b.dataset.route;render();document.getElementById("operations-main").focus({preventScroll:true});window.scrollTo({top:0,behavior:"auto"});}));
}
function board(eyebrow,title,sub,metas,body){
return `<article class='board'><div class='board-head'><div class='eyebrow'>${esc(eyebrow)}</div><h1 class='surface-title'>${esc(title)}</h1><p class='sub'>${esc(sub)}</p><div class='meta-row'>${metas}</div></div><div class='board-body'>${body}</div></article>`;
}
function pill(txt,cls){return `<span class='pill'><span class='dot ${cls||""}'></span><bdi>${esc(txt)}</bdi></span>`;}
function bars28HTML(active){
let h="<div class='bars28' role='img' aria-label='crowd signal'>";
for(let i=0;i<28;i++){h+=`<i class='${i<active?"done":""} ${i===active?"now":""}'></i>`;}
return h+"</div>";
}
function chartSVG(localeDir){
const pts=[4,6,9,14,22,31,37,42,48,44,52,61,58,49,55,63,66,58,47,38,30,24,18,14];
const W=720,H=220,P=18;
const max=72;
const step=(W-P*2)/(pts.length-1);
let d="M "+P+" "+(H-P-(pts[0]/max)*(H-P*2));
for(let i=1;i<pts.length;i++){d+=" L "+(P+i*step).toFixed(1)+" "+(H-P-(pts[i]/max)*(H-P*2)).toFixed(1);}
let area=d+` L ${(P+(pts.length-1)*step).toFixed(1)} ${H-P} L ${P} ${H-P} Z`;
let dots="";
pts.forEach((v,i)=>{if(i%4===2){const x=P+i*step,y=H-P-(v/max)*(H-P*2);dots+=`<circle cx='${x.toFixed(1)}' cy='${y.toFixed(1)}' r='3.4' fill='#ff2946'><title>${v}</title></circle>`;}});
let grid="";
for(let g=0;g<=4;g++){const y=P+g*(H-P*2)/4;grid+=`<line x1='${P}' y1='${y}' x2='${W-P}' y2='${y}' stroke='#22222a' stroke-width='1'/>`;}
return `<svg class='chart' viewBox='0 0 ${W} ${H}' role='img' aria-label='occupancy curve'><g>${grid}</g><path d='${area}' fill='rgba(229,25,53,.16)'/><path d='${d}' fill='none' stroke='#e51935' stroke-width='2.6'/>${dots}<circle cx='${(P+11*step).toFixed(1)}' cy='${(H-P-(61/max)*(H-P*2)).toFixed(1)}' r='5' fill='none' stroke='#f5f3f2' stroke-width='1.6'/></svg>`;
}
function tableHTML(rows){
let h="<div class='table-wrap' tabindex='0'><table class='data'><thead><tr><th>Time</th><th>State</th><th>Band</th><th>Count</th></tr></thead><tbody>";
rows.forEach(r=>{h+=`<tr><td><bdi>${r[0]}</bdi></td><td>${r[1]}</td><td>${r[2]}</td><td><bdi>${r[3]}</bdi></td></tr>`;});
return h+"</tbody></table></div>";
}
function vOverview(){
if(locale==="ar"){
return board("الصالة الآن","نظرة عامة على التشغيل","كل ما يحتاجه المالك في أول نظرة: الحالة الآن، ثم ما يستحق الانتباه.",
pill("مفتوح · مزدحم","") + pill("مباشر · قبل 40 ثانية","") + pill("حادثة واحدة مفتوحة","stale"),
`<div class='kpis'>
<div class='kpi r'><label>الموجودون الآن (تقريبي)</label><strong><bdi>≈ 61</bdi></strong><span>مزدحم · الإشارة 17/28</span></div>
<div class='kpi g'><label>ذروة اليوم</label><strong><bdi>66</bdi></strong><span>عند 06:42 م · تغطية 96%</span></div>
<div class='kpi a'><label>الحالة</label><strong style='font-size:19px'>مفتوح · مباشر</strong><span>Asia/Riyadh · يغلق 11:00 م</span></div>
<div class='kpi n'><label>التنبيهات</label><strong style='font-size:19px'>1 مفتوحة</strong><span>انقطاع دفع · يتعافى</span></div>
</div>
<div class='grid2'>
<div class='panel'><h3>إشارة الازدحام الآن</h3><p class='hint'>المستوى يتقدم على الرقم. هذه لقطة مفهوم ثابتة.</p>${bars28HTML(17)}<div class='legend'><span>هادئ</span><span>متوسط</span><span><b>مزدحم</b></span><span>شديد الازدحام</span></div></div>
<div class='panel'><h3>يستحق الانتباه</h3><p class='hint'>مرتبة حسب ما يغير قرار اليوم.</p><div style='display:grid;gap:10px'>
<div class='notice'><b>انقطاع دفع واحد</b> — 9 دقائق · تم إرسال تنبيه الصيانة · <button class='btn small' data-goto='health'>عرض النظام</button></div>
<div class='notice'><b>رمز الموظفين نشط</b> — آخر تدوير قبل 21 يومًا · <button class='btn small' data-goto='access'>مراجعة الوصول</button></div>
<div class='notice'><b>إعدادات معلقة</b> — مسودة سعة 240 بانتظار التأكيد · <button class='btn small' data-goto='settings'>مراجعة المسودة</button></div>
</div></div>
</div>`);
}
return board("Right now","Operations overview","Everything an owner needs at first glance: the gym now, then what deserves attention.",
pill("Open · Busy","") + pill("Live · 40s ago","") + pill("1 open incident","stale"),
`<div class='kpis'>
<div class='kpi r'><label>Present now (approx)</label><strong><bdi>≈ 61</bdi></strong><span>Busy · signal 17/28</span></div>
<div class='kpi g'><label>Today peak</label><strong><bdi>66</bdi></strong><span>at 06:42 PM · 96% coverage</span></div>
<div class='kpi a'><label>State</label><strong style='font-size:19px'>Open · live</strong><span>Asia/Riyadh · closes 11:00 PM</span></div>
<div class='kpi n'><label>Alerts</label><strong style='font-size:19px'>1 open</strong><span>push gap · recovering</span></div>
</div>
<div class='grid2'>
<div class='panel'><h3>Crowd signal now</h3><p class='hint'>Band leads the number. Static concept snapshot.</p>${bars28HTML(17)}<div class='legend'><span>Quiet</span><span>Moderate</span><span><b>Busy</b></span><span>Packed</span></div></div>
<div class='panel'><h3>Needs attention</h3><p class='hint'>Ranked by what changes today.</p><div style='display:grid;gap:10px'>
<div class='notice'><b>One push gap</b> — 9 min · maintainer notified · <button class='btn small' data-goto='health'>Open status</button></div>
<div class='notice'><b>Staff PIN active</b> — rotated 21 days ago · <button class='btn small' data-goto='access'>Review access</button></div>
<div class='notice'><b>Pending settings</b> — capacity 240 draft awaits confirm · <button class='btn small' data-goto='settings'>Review draft</button></div>
</div></div>
</div>`);

function heatHTML(){

}

});

}

}));
const af=document.getElementById("applyF");
if(af) af.addEventListener("click",()=>toast(locale==="ar"?"طُبّق الترشيح افتراضيًا.":"Fixture filter applied."));
}
function toast(msg){
let r=document.querySelector(".toast-region");
if(!r){r=document.createElement("div");r.className="toast-region";r.setAttribute("role","status");document.body.appendChild(r);}
const el=document.createElement("div");el.className="toast";el.textContent=msg;r.appendChild(el);
requestAnimationFrame(()=>el.classList.add("show"));
setTimeout(()=>{el.classList.remove("show");setTimeout(()=>el.remove(),250);},2600);
}
function openDialog(subject){
let back=document.getElementById("dlgBack");
if(!back){
back=document.createElement("div");back.className="dialog-back";back.id="dlgBack";
back.innerHTML=`<div class='dialog' role='dialog' aria-modal='true' aria-labelledby='dlgT'><h3 id='dlgT'></h3><p id='dlgP'></p><div class='field'><label id='dlgL'></label><input class='input' id='dlgWhy' type='text'></div><div class='dialog-actions'><button class='btn ghost' id='dlgCancel'></button><button class='btn danger' id='dlgOk'></button></div></div>`;
document.body.appendChild(back);
}
const isAr=locale==="ar";
back.querySelector("#dlgT").textContent=isAr?"تأكيد إجراء حساس":"Confirm sensitive action";
back.querySelector("#dlgP").textContent=isAr?`سيُسجل هذا ضد (${subject}) في سجل النشاط.`: `This will be logged against (${subject}) in the activity log.`;
back.querySelector("#dlgL").textContent=isAr?"السبب (مطلوب)":"Reason (required)";
back.querySelector("#dlgWhy").value="";
back.querySelector("#dlgCancel").textContent=isAr?"تراجع":"Cancel";
back.querySelector("#dlgOk").textContent=isAr?"تأكيد التعطيل":"Confirm deactivate";
back.classList.add("open");
const prev=document.activeElement;
const why=back.querySelector("#dlgWhy");
const close=()=>{back.classList.remove("open");if(prev&&prev.focus)prev.focus();};
back.querySelector("#dlgCancel").onclick=close;
back.onmousedown=e=>{if(e.target===back)close();};
document.onkeydown=e=>{if(e.key==="Escape"&&back.classList.contains("open"))close();};
back.querySelector("#dlgOk").onclick=()=>{
if(!why.value.trim()){why.focus();toast(isAr?"أدخل السبب قبل التأكيد.":"Enter a reason first.");return;}
close();toast(isAr?"سُجل الإجراء افتراضيًا في السجل.":"Action logged as a fixture.");
};
setTimeout(()=>why.focus(),30);
}
document.getElementById("langToggle").addEventListener("click",()=>{
locale=locale==="ar"?"en":"ar";
document.documentElement.lang=locale;
document.documentElement.dir=locale==="ar"?"rtl":"ltr";
document.querySelector("[data-i18n='skip']").textContent=STR[locale].skip;
document.querySelector("[data-i18n='banner']").textContent=STR[locale].banner;
document.querySelector("[data-i18n='ownerConsole']").textContent=STR[locale].ownerConsole;
document.getElementById("liveLabel").textContent=STR[locale].live;
document.getElementById("langToggle").textContent=locale==="ar"?"EN":"عربي";
render();
});
render();
</script>
</body>
</html>
