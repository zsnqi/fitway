<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>FITWAY — الإدارة</title>
<style>
/* ============================================================
   Concept D — "The Owner's Desk" (مكتب المالك)
   Informal exploration fixture. Not authority. No network calls.
   Navigation model: hub-and-spoke (desk home + destinations popover
   + breadcrumb). No side rail, no chapter column, no tab strip.
   ============================================================ */
@font-face { font-family:"Cairo"; src:url("fonts/cairo-arabic-400-normal.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:swap; unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFC; }
@font-face { font-family:"Cairo"; src:url("fonts/cairo-arabic-500-normal.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:swap; unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFC; }
@font-face { font-family:"Cairo"; src:url("fonts/cairo-arabic-600-normal.woff2") format("woff2"); font-weight:600; font-style:normal; font-display:swap; unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFC; }
@font-face { font-family:"Cairo"; src:url("fonts/cairo-arabic-700-normal.woff2") format("woff2"); font-weight:700; font-style:normal; font-display:swap; unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFC; }
@font-face { font-family:"Cairo"; src:url("fonts/cairo-latin-400-normal.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:swap; unicode-range:U+0000-05FF,U+2000-206F; }
@font-face { font-family:"Cairo"; src:url("fonts/cairo-latin-500-normal.woff2") format("woff2"); font-weight:500; font-style:normal; font-display:swap; unicode-range:U+0000-05FF,U+2000-206F; }
@font-face { font-family:"Cairo"; src:url("fonts/cairo-latin-600-normal.woff2") format("woff2"); font-weight:600; font-style:normal; font-display:swap; unicode-range:U+0000-05FF,U+2000-206F; }
@font-face { font-family:"Cairo"; src:url("fonts/cairo-latin-700-normal.woff2") format("woff2"); font-weight:700; font-style:normal; font-display:swap; unicode-range:U+0000-05FF,U+2000-206F; }

:root {
  color-scheme: dark;
  --fw-obsidian:#08090a; --fw-coal:#101012; --fw-graphite:#1a1a1e;
  --fw-oxblood:#4d0713; --fw-red:#e51935; --fw-red-bright:#ff2946;
  --fw-chalk:#f5f3f2; --fw-muted:#c9c3c4; --fw-text-subtle:#aaa4a6;
  --fw-live:#4be29b; --fw-delayed:#d9a400; --fw-offline:#9aa0aa;
  --fw-space-1:4px; --fw-space-2:8px; --fw-space-3:12px; --fw-space-4:16px;
  --fw-space-6:24px; --fw-space-8:32px; --fw-space-12:48px; --fw-space-18:72px;
  --fw-radius-control:8px; --fw-radius-surface:16px; --fw-radius-board:28px;
  --fw-duration-fast:120ms; --fw-duration-base:180ms;
  --fw-ease-out:cubic-bezier(0,0,0.2,1);
  --hairline:1px solid color-mix(in srgb, var(--fw-chalk) 9%, transparent);
  --hairline-strong:1px solid color-mix(in srgb, var(--fw-chalk) 16%, transparent);
  --measure: 1064px;
  --measure-narrow: 720px;
}
* { box-sizing:border-box; }
html { background:var(--fw-obsidian); }
body {
  margin:0; min-height:100vh; min-height:100svh;
  background:var(--fw-obsidian); color:var(--fw-chalk);
  font-family:"Cairo", system-ui, sans-serif; font-weight:400;
  font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
bdi { unicode-bidi:isolate; }
.num { font-variant-numeric:tabular-nums; unicode-bidi:isolate; }
[lang] .lat { font-feature-settings:"tnum"; }
h1,h2,h3,h4,p { margin:0; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input,select { font:inherit; }
a { color:inherit; }
:focus { outline:none; }
:focus-visible {
  outline:2px solid var(--fw-red-bright); outline-offset:2px; border-radius:4px;
}
::selection { background:color-mix(in srgb, var(--fw-red) 60%, transparent); }
.sr-only {
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  clip-path:inset(50%); overflow:hidden; white-space:nowrap; border:0;
}
.skip {
  position:fixed; inset-block-start:10px; inset-inline-start:12px; z-index:80;
  transform:translateY(-300%);
  background:var(--fw-graphite); color:var(--fw-chalk);
  padding:10px 18px; border-radius:var(--fw-radius-control); border:var(--hairline-strong);
  text-decoration:none; font-weight:600; font-size:14px;
  transition:transform var(--fw-duration-base) var(--fw-ease-out);
}
.skip:focus-visible { transform:translateY(0); }

/* ---------- static atmosphere (never animated) ---------- */
.atmo { position:fixed; inset:0; z-index:-2; pointer-events:none; background:var(--fw-obsidian); }
.atmo::before {
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(58% 44% at 78% -6%, color-mix(in srgb, var(--fw-oxblood) 62%, transparent) 0%, transparent 70%),
    radial-gradient(42% 34% at 8% 108%, color-mix(in srgb, var(--fw-oxblood) 34%, transparent) 0%, transparent 72%),
    linear-gradient(180deg, #0a0b0d 0%, var(--fw-obsidian) 46%, #070809 100%);
}
.atmo::after {
  content:""; position:absolute; inset-block-start:-16%; inset-inline-end:-10%;
  width:54vw; height:54vw; border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--fw-red) 9%, transparent), transparent 62%);
  filter:blur(90px);
}
.watermark {
  position:fixed; inset-block-end:-4vw; inset-inline-start:-1vw; z-index:-1;
  font-weight:700; font-size:22vw; line-height:.8; letter-spacing:.04em;
  color:transparent; -webkit-text-stroke:1px color-mix(in srgb, var(--fw-chalk) 5%, transparent);
  pointer-events:none; user-select:none;
}

/* ---------- masthead ---------- */
.mast {
  position:sticky; inset-block-start:0; z-index:40;
  background:color-mix(in srgb, var(--fw-coal) 88%, transparent);
  border-block-end:var(--hairline);
}
.mast__in {
  max-width:var(--measure); margin-inline:auto; padding-inline:var(--fw-space-6);
  min-height:60px; display:flex; align-items:center; gap:var(--fw-space-4);
}
.brand { display:flex; align-items:center; gap:10px; min-width:0; }
.brand svg { flex:none; color:var(--fw-chalk); }
.brand__word { font-weight:700; letter-spacing:.14em; font-size:15px; }
.brand__scope {
  font-size:12px; font-weight:600; color:var(--fw-text-subtle);
  border-inline-start:var(--hairline-strong); padding-inline-start:10px; margin-inline-start:2px;
}
.crumb {
  display:flex; align-items:center; gap:8px; min-width:0;
  font-size:13px; color:var(--fw-text-subtle); margin-inline-start:var(--fw-space-3);
}
.crumb button {
  color:var(--fw-muted); font-size:13px; font-weight:600; padding:6px 2px;
  border-radius:6px; transition:color var(--fw-duration-fast) var(--fw-ease-out);
}
.crumb button:hover { color:var(--fw-chalk); }
.crumb .sep { color:var(--fw-text-subtle); }
[dir="rtl"] .crumb .sep { transform:scaleX(-1); }
.crumb .here { color:var(--fw-chalk); font-weight:600; }
.mast__end { margin-inline-start:auto; display:flex; align-items:center; gap:var(--fw-space-2); }
.mbtn {
  min-height:44px; padding:0 14px; border-radius:var(--fw-radius-control);
  color:var(--fw-muted); font-size:14px; font-weight:600;
  display:inline-flex; align-items:center; gap:8px;
  transition:color var(--fw-duration-fast) var(--fw-ease-out), background var(--fw-duration-fast) var(--fw-ease-out);
}
.mbtn:hover { color:var(--fw-chalk); background:color-mix(in srgb, var(--fw-chalk) 5%, transparent); }
.mbtn--dest { color:var(--fw-chalk); border:var(--hairline-strong); }
.mbtn--dest:hover { border-color:color-mix(in srgb, var(--fw-chalk) 30%, transparent); background:transparent; }
.mbtn svg { flex:none; }
.mast__vr { width:1px; height:22px; background:color-mix(in srgb, var(--fw-chalk) 14%, transparent); margin-inline:4px; }

/* destinations popover */
.pop-veil { position:fixed; inset:0; z-index:48; background:transparent; }
.pop {
  position:fixed; z-index:49; inset-block-start:66px; inset-inline-end:max(24px, calc((100vw - var(--measure))/2 + 24px));
  width:300px; background:var(--fw-coal); border:var(--hairline-strong);
  border-radius:var(--fw-radius-surface); padding:8px;
  box-shadow:0 24px 48px color-mix(in srgb, #000 55%, transparent);
  opacity:0; transform:translateY(-4px); pointer-events:none;
  transition:opacity var(--fw-duration-base) var(--fw-ease-out), transform var(--fw-duration-base) var(--fw-ease-out);
}
.pop.open { opacity:1; transform:none; pointer-events:auto; }
.pop__label { font-size:11px; font-weight:600; color:var(--fw-text-subtle); padding:8px 10px 6px; }
.pop a {
  display:flex; align-items:center; gap:12px; padding:10px;
  border-radius:10px; text-decoration:none; min-height:44px;
  transition:background var(--fw-duration-fast) var(--fw-ease-out);
}
.pop a:hover, .pop a:focus-visible { background:var(--fw-graphite); }
.pop a[aria-current="page"] { background:color-mix(in srgb, var(--fw-oxblood) 42%, transparent); }
.pop a[aria-current="page"] .pop__name { color:var(--fw-chalk); }
.pop__name { font-weight:600; font-size:14px; color:var(--fw-muted); }
.pop__fact { margin-inline-start:auto; font-size:12px; color:var(--fw-text-subtle); }
.pop__dot { width:6px; height:6px; border-radius:50%; background:var(--fw-red); flex:none; }
</style>
<style>
/* ---------- live status band (route-level truth, always visible) ---------- */
.band {
  position:sticky; inset-block-start:60px; z-index:30;
  background:color-mix(in srgb, var(--fw-obsidian) 90%, transparent);
  border-block-end:var(--hairline);
}
.band__in {
  max-width:var(--measure); margin-inline:auto; padding:10px var(--fw-space-6);
  display:flex; align-items:center; gap:var(--fw-space-4); flex-wrap:wrap;
}
.livechip { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--fw-chalk); }
.livechip .dot {
  width:8px; height:8px; border-radius:50%; background:var(--fw-live); flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--fw-live) 18%, transparent);
}
.bandchip {
  display:inline-flex; align-items:center; gap:8px;
  min-height:28px; padding:2px 12px; border-radius:999px;
  background:color-mix(in srgb, var(--fw-oxblood) 55%, var(--fw-coal));
  border:1px solid color-mix(in srgb, var(--fw-red) 38%, transparent);
  font-size:13px; font-weight:700; color:var(--fw-chalk);
}
.bandchip svg { color:var(--fw-red-bright); }
.band__fact { font-size:13px; color:var(--fw-muted); display:inline-flex; align-items:baseline; gap:6px; }
.band__fact b { color:var(--fw-chalk); font-weight:600; }
.band__time { margin-inline-start:auto; font-size:12px; color:var(--fw-text-subtle); }
.band__sep { width:1px; height:16px; background:color-mix(in srgb, var(--fw-chalk) 12%, transparent); }

/* ---------- page frame ---------- */
.view { max-width:var(--measure); margin-inline:auto; padding:0 var(--fw-space-6) var(--fw-space-18); }
.phead { padding-block:var(--fw-space-12) var(--fw-space-8); }
.phead .eyebrow {
  font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--fw-red-bright);
  display:flex; align-items:center; gap:10px;
}
.phead .eyebrow::after { content:""; flex:0 0 44px; height:1px; background:color-mix(in srgb, var(--fw-red) 55%, transparent); }
.phead h1 {
  font-size:clamp(30px, 4.4vw, 44px); font-weight:700; line-height:1.14;
  margin-block-start:12px; letter-spacing:0;
}
.phead .lede { margin-block-start:10px; color:var(--fw-muted); font-size:16px; max-width:60ch; }

/* section rails: separators, not card walls */
.rail { border-block-start:var(--hairline); padding-block:var(--fw-space-8); }
.rail__head { display:flex; align-items:baseline; gap:var(--fw-space-4); flex-wrap:wrap; margin-block-end:var(--fw-space-6); }
.rail__head h2 { font-size:20px; font-weight:700; }
.rail__head .helper { color:var(--fw-text-subtle); font-size:13px; }
.rail__head .rail__aside { margin-inline-start:auto; font-size:13px; color:var(--fw-muted); }

/* ---------- desk hero ---------- */
.hero { padding-block:var(--fw-space-8) var(--fw-space-12); }
.hero__top { display:grid; grid-template-columns:auto min-content; gap:var(--fw-space-8); align-items:end; }
.hero__band-label { font-size:13px; font-weight:600; color:var(--fw-text-subtle); margin-block-end:6px; }
.hero__band { font-size:clamp(52px, 8vw, 84px); font-weight:700; line-height:1.04; color:var(--fw-chalk); }
.hero__band .u { display:block; height:6px; width:.9em; margin-block-start:14px; border-radius:3px;
  background:linear-gradient(90deg, var(--fw-red), var(--fw-red-bright)); }
.hero__count { text-align:end; border-inline-start:var(--hairline-strong); padding-inline-start:var(--fw-space-8); }
.hero__count .l { font-size:13px; font-weight:600; color:var(--fw-text-subtle); }
.hero__count .v { font-size:clamp(34px, 4.6vw, 52px); font-weight:700; line-height:1.1; }
.hero__count .s { font-size:12px; color:var(--fw-text-subtle); }
.signal { margin-block-start:var(--fw-space-8); }
.signal__bars { display:flex; gap:4px; height:40px; align-items:flex-end; }
.signal__bars i { flex:1; border-radius:3px 3px 2px 2px; }
.signal__bars i.done { background:linear-gradient(180deg, var(--fw-red), var(--fw-oxblood)); }
.signal__bars i.now  { background:linear-gradient(180deg, var(--fw-red-bright), var(--fw-red)); box-shadow:0 0 12px color-mix(in srgb, var(--fw-red) 40%, transparent); }
.signal__bars i.todo { background:var(--fw-graphite); }
.signal__scale { display:flex; justify-content:space-between; margin-block-start:8px; font-size:11px; color:var(--fw-text-subtle); }
.signal__scale .cur { color:var(--fw-chalk); font-weight:600; }

/* glance figures */
.glance { display:grid; grid-template-columns:repeat(3, 1fr); border-block-start:var(--hairline); }
.glance > div { padding:var(--fw-space-6); }
.glance > div:first-child { padding-inline-start:0; }
.glance > div + div { border-inline-start:var(--hairline); }
.glance .l { font-size:12px; font-weight:600; color:var(--fw-text-subtle); }
.glance .v { font-size:28px; font-weight:700; margin-block-start:4px; }
.glance .s { font-size:12px; color:var(--fw-text-subtle); margin-block-start:2px; }

/* ---------- desk destination index (text-led rows, not cards) ---------- */
.index { border-block-start:var(--hairline); }
.index a {
  display:grid; grid-template-columns:auto 1fr auto auto; align-items:center;
  gap:var(--fw-space-6); padding:var(--fw-space-6) var(--fw-space-2);
  border-block-end:var(--hairline); text-decoration:none; min-height:64px;
  transition:background var(--fw-duration-fast) var(--fw-ease-out), padding var(--fw-duration-base) var(--fw-ease-out);
}
.index a:hover { background:color-mix(in srgb, var(--fw-chalk) 3%, transparent); }
.index a:hover .index__go { color:var(--fw-red-bright); transform:translateX(0); }
.index a:hover .index__name { color:var(--fw-chalk); }
.index__key { font-size:12px; font-weight:600; color:var(--fw-text-subtle); width:22px; }
.index__body { min-width:0; }
.index__name { font-size:20px; font-weight:700; color:var(--fw-muted); transition:color var(--fw-duration-fast) var(--fw-ease-out); }
.index__desc { font-size:13px; color:var(--fw-text-subtle); margin-block-start:2px; }
.index__fact { font-size:13px; color:var(--fw-muted); text-align:end; max-width:220px; }
.index__fact b { color:var(--fw-chalk); font-weight:600; }
.index__go { color:var(--fw-text-subtle); transition:color var(--fw-duration-fast) var(--fw-ease-out), transform var(--fw-duration-base) var(--fw-ease-out); }
[dir="rtl"] .index__go svg { transform:scaleX(-1); }
[dir="rtl"] .index a:hover .index__go { transform:translateX(0); }

/* ---------- data board (charts/tables get the full measure) ---------- */
.board {
  background:color-mix(in srgb, var(--fw-coal) 72%, transparent);
  border:var(--hairline); border-radius:var(--fw-radius-board);
  padding:var(--fw-space-8);
}
.board__head { display:flex; align-items:baseline; gap:var(--fw-space-4); flex-wrap:wrap; margin-block-end:var(--fw-space-6); }
.board__head h3 { font-size:16px; font-weight:700; }
.board__head .hint { font-size:12px; color:var(--fw-text-subtle); }
.legend { display:flex; gap:var(--fw-space-4); flex-wrap:wrap; margin-inline-start:auto; font-size:12px; color:var(--fw-muted); }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.legend i { width:12px; height:12px; border-radius:3px; display:inline-block; }
.curve { width:100%; height:auto; display:block; }
.curve text { font-family:"Cairo", sans-serif; }
.figrow { display:grid; grid-template-columns:repeat(4, 1fr); gap:0; margin-block-start:var(--fw-space-6); border-block-start:var(--hairline); }
.figrow > div { padding:var(--fw-space-4) var(--fw-space-4) 0; }
.figrow > div:first-child { padding-inline-start:0; }
.figrow > div + div { border-inline-start:var(--hairline); }
.figrow .l { font-size:12px; font-weight:600; color:var(--fw-text-subtle); }
.figrow .v { font-size:22px; font-weight:700; margin-block-start:2px; }
.figrow .v small { font-size:13px; font-weight:500; color:var(--fw-muted); }
.figrow .s { font-size:11px; color:var(--fw-text-subtle); }

/* tables */
.tblwrap { overflow-x:auto; border:var(--hairline); border-radius:var(--fw-radius-surface); }
.tblwrap:focus-visible { outline-offset:3px; }
table.data { width:100%; border-collapse:collapse; font-size:14px; min-width:560px; }
table.data caption { text-align:start; font-size:12px; color:var(--fw-text-subtle); padding:10px 16px; }
table.data th {
  text-align:start; font-size:12px; font-weight:600; color:var(--fw-text-subtle);
  padding:12px 16px; border-block-end:var(--hairline-strong); background:color-mix(in srgb, var(--fw-graphite) 55%, transparent);
}
table.data td { padding:12px 16px; border-block-end:var(--hairline); color:var(--fw-muted); vertical-align:top; }
table.data td.k { color:var(--fw-chalk); font-weight:600; white-space:nowrap; }
table.data tr:last-child td { border-block-end:0; }
table.data tbody tr { transition:background var(--fw-duration-fast) var(--fw-ease-out); }
table.data tbody tr:hover { background:color-mix(in srgb, var(--fw-chalk) 3%, transparent); }
.pill {
  display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:999px;
  font-size:12px; font-weight:600; border:1px solid transparent; white-space:nowrap;
}
.pill--live { color:var(--fw-live); border-color:color-mix(in srgb, var(--fw-live) 40%, transparent); background:color-mix(in srgb, var(--fw-live) 8%, transparent); }
.pill--warn { color:var(--fw-delayed); border-color:color-mix(in srgb, var(--fw-delayed) 40%, transparent); background:color-mix(in srgb, var(--fw-delayed) 8%, transparent); }
.pill--off  { color:var(--fw-offline); border-color:color-mix(in srgb, var(--fw-offline) 36%, transparent); background:color-mix(in srgb, var(--fw-offline) 8%, transparent); }
.pill--red  { color:var(--fw-red-bright); border-color:color-mix(in srgb, var(--fw-red) 45%, transparent); background:color-mix(in srgb, var(--fw-red) 8%, transparent); }
/* ---------- heatmap ---------- */
.heat { overflow-x:auto; }
.heat__grid { display:grid; grid-template-columns:max-content repeat(18, minmax(26px,1fr)); gap:3px; min-width:760px; }
.heat__axis { font-size:11px; color:var(--fw-text-subtle); display:flex; align-items:center; justify-content:center; padding:2px 0; }
.heat__day { font-size:12px; font-weight:600; color:var(--fw-muted); display:flex; align-items:center; padding-inline-end:10px; }
.heat button {
  aspect-ratio:1; min-height:30px; border-radius:5px; background:var(--fw-graphite);
  transition:transform var(--fw-duration-fast) var(--fw-ease-out), box-shadow var(--fw-duration-fast) var(--fw-ease-out);
}
.heat button:hover { transform:scale(1.12); }
.heat button[aria-pressed="true"] { box-shadow:0 0 0 2px var(--fw-chalk); }
.heat button.closed { background:repeating-linear-gradient(45deg, var(--fw-graphite) 0 3px, transparent 3px 6px); }
.heat__detail {
  margin-block-start:var(--fw-space-6); border:var(--hairline); border-radius:var(--fw-radius-surface);
  padding:var(--fw-space-4) var(--fw-space-6); display:flex; gap:var(--fw-space-6); flex-wrap:wrap; align-items:baseline;
  background:color-mix(in srgb, var(--fw-coal) 72%, transparent);
}
.heat__detail .t { font-weight:700; }
.heat__detail .d { font-size:13px; color:var(--fw-muted); }
.heat__detail .d b { color:var(--fw-chalk); }

/* ---------- forms ---------- */
.formgrid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:var(--fw-space-6); max-width:var(--measure-narrow); }
.field { display:flex; flex-direction:column; gap:8px; }
.field > label { font-size:13px; font-weight:600; color:var(--fw-muted); }
.field .unit { font-size:12px; color:var(--fw-text-subtle); font-weight:400; }
.field input, .field select {
  min-height:48px; padding:10px 14px; border-radius:var(--fw-radius-control);
  background:var(--fw-graphite); border:1px solid color-mix(in srgb, var(--fw-chalk) 14%, transparent);
  color:var(--fw-chalk); font-variant-numeric:tabular-nums; width:100%;
  transition:border-color var(--fw-duration-fast) var(--fw-ease-out), background var(--fw-duration-fast) var(--fw-ease-out);
}
.field input:hover, .field select:hover { border-color:color-mix(in srgb, var(--fw-chalk) 26%, transparent); }
.field input:focus-visible, .field select:focus-visible { outline:2px solid var(--fw-red-bright); outline-offset:1px; border-color:transparent; }
.field input[aria-invalid="true"] { border-color:var(--fw-red); }
.field .err { font-size:12px; color:var(--fw-red-bright); display:none; }
.field.invalid .err { display:block; }
.field .ro {
  min-height:48px; display:flex; align-items:center; gap:8px; padding:10px 0;
  color:var(--fw-muted); font-size:14px; border-block-end:var(--hairline);
}
.weektbl { max-width:var(--measure-narrow); }
.weektbl .row {
  display:grid; grid-template-columns:minmax(96px,1fr) repeat(2, minmax(0,140px)) auto;
  gap:var(--fw-space-4); align-items:center; padding:10px 0; border-block-end:var(--hairline);
}
.weektbl .row:last-child { border-block-end:0; }
.weektbl .d { font-weight:600; }
.weektbl .row select { min-height:44px; padding:8px 12px; border-radius:var(--fw-radius-control);
  background:var(--fw-graphite); border:1px solid color-mix(in srgb, var(--fw-chalk) 14%, transparent); color:var(--fw-chalk); }
.weektbl .row select:disabled { opacity:.45; }
.chk { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--fw-muted); min-height:44px; cursor:pointer; }
.chk input { width:18px; height:18px; accent-color:var(--fw-red); }

/* separated action zone for governance */
.actionzone {
  margin-block-start:var(--fw-space-8); border:1px solid color-mix(in srgb, var(--fw-red) 26%, transparent);
  border-radius:var(--fw-radius-surface); background:color-mix(in srgb, var(--fw-oxblood) 20%, var(--fw-coal));
  padding:var(--fw-space-6); display:flex; align-items:center; gap:var(--fw-space-4); flex-wrap:wrap;
}
.actionzone .z { font-size:13px; color:var(--fw-muted); max-width:52ch; }
.actionzone .z b { color:var(--fw-chalk); display:block; font-size:14px; margin-block-end:2px; }
.actionzone .acts { margin-inline-start:auto; display:flex; gap:var(--fw-space-3); flex-wrap:wrap; }

/* buttons */
.btn {
  min-height:44px; padding:0 18px; border-radius:var(--fw-radius-control);
  font-size:14px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:background var(--fw-duration-fast) var(--fw-ease-out), border-color var(--fw-duration-fast) var(--fw-ease-out), color var(--fw-duration-fast) var(--fw-ease-out);
}
.btn--primary { background:var(--fw-red); color:var(--fw-chalk); }
.btn--primary:hover { background:var(--fw-red-bright); }
.btn--primary:disabled { background:var(--fw-graphite); color:var(--fw-text-subtle); cursor:not-allowed; }
.btn--ghost { border:var(--hairline-strong); color:var(--fw-muted); }
.btn--ghost:hover { color:var(--fw-chalk); border-color:color-mix(in srgb, var(--fw-chalk) 30%, transparent); }
.btn--danger { border:1px solid color-mix(in srgb, var(--fw-red) 45%, transparent); color:var(--fw-red-bright); }
.btn--danger:hover { background:color-mix(in srgb, var(--fw-red) 10%, transparent); }
.statechip { font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; border:var(--hairline-strong); color:var(--fw-muted); }
.statechip.dirty { color:var(--fw-delayed); border-color:color-mix(in srgb, var(--fw-delayed) 40%, transparent); }
.statechip.saved { color:var(--fw-live); border-color:color-mix(in srgb, var(--fw-live) 40%, transparent); }
/* ---------- dialogs ---------- */
.dlg-veil {
  position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, #000 62%, transparent); padding:var(--fw-space-4);
  opacity:0; pointer-events:none; transition:opacity var(--fw-duration-base) var(--fw-ease-out);
}
.dlg-veil.open { opacity:1; pointer-events:auto; }
.dlg {
  width:min(480px, 100%); background:var(--fw-coal); border:var(--hairline-strong);
  border-radius:var(--fw-radius-surface); padding:var(--fw-space-8);
  transform:translateY(6px); transition:transform var(--fw-duration-base) var(--fw-ease-out);
  max-height:calc(100vh - 48px); max-height:calc(100svh - 48px); overflow:auto;
}
.dlg-veil.open .dlg { transform:none; }
.dlg h3 { font-size:20px; font-weight:700; margin-block-end:6px; }
.dlg .sub { font-size:14px; color:var(--fw-muted); margin-block-end:var(--fw-space-6); }
.dlg .acts { display:flex; gap:var(--fw-space-3); justify-content:flex-end; margin-block-start:var(--fw-space-6); flex-wrap:wrap; }

/* toasts */
.toasts { position:fixed; inset-block-end:20px; inset-inline-start:20px; z-index:70; display:flex; flex-direction:column; gap:10px; max-width:min(420px, calc(100vw - 40px)); }
.toast {
  background:var(--fw-graphite); border:var(--hairline-strong); border-inline-start:3px solid var(--fw-live);

  box-shadow:0 16px 32px color-mix(in srgb, #000 50%, transparent);
}
.toast.err { border-inline-start-color:var(--fw-red); }

/* system status strips */
.statline { display:grid; grid-template-columns:repeat(4,1fr); border-block-start:var(--hairline); }
.statline > div { padding:var(--fw-space-6) var(--fw-space-4) 0; }
.statline > div:first-child { padding-inline-start:0; }
.statline > div + div { border-inline-start:var(--hairline); }
.statline .l { font-size:12px; font-weight:600; color:var(--fw-text-subtle); }
.statline .v { font-size:24px; font-weight:700; margin-block-start:4px; }
.statline .v small { font-size:13px; font-weight:500; color:var(--fw-muted); }
.statline .s { font-size:11px; color:var(--fw-text-subtle); }

/* owners list */
.owners { border-block-start:var(--hairline); }
.owners li {
  list-style:none; display:flex; align-items:center; gap:var(--fw-space-4);
  padding:var(--fw-space-4) 0; border-block-end:var(--hairline);
}
.owners .avatar {
  width:40px; height:40px; border-radius:50%; flex:none;
  background:color-mix(in srgb, var(--fw-oxblood) 60%, var(--fw-graphite));
  color:var(--fw-chalk); display:flex; align-items:center; justify-content:center; font-weight:700;
}
.owners .who b { display:block; font-size:15px; }
.owners .who span { font-size:12px; color:var(--fw-text-subtle); }
.owners .tail { margin-inline-start:auto; display:flex; align-items:center; gap:var(--fw-space-3); }
.owners { padding:0; margin:0; }

/* wow comparison */
.wow { display:grid; grid-template-columns:1fr 1fr; gap:var(--fw-space-6); }
.wow .cell { border:var(--hairline); border-radius:var(--fw-radius-surface); padding:var(--fw-space-6); }
.wow .l { font-size:12px; font-weight:600; color:var(--fw-text-subtle); }
.wow .v { font-size:30px; font-weight:700; margin-block-start:4px; }
.wow .d { font-size:13px; margin-block-start:4px; }
.wow .up { color:var(--fw-red-bright); font-weight:600; }

/* footer */
.foot {
  max-width:var(--measure); margin:var(--fw-space-12) auto 0; padding:var(--fw-space-6);
  border-block-start:var(--hairline); font-size:12px; color:var(--fw-text-subtle);
  display:flex; gap:var(--fw-space-4); flex-wrap:wrap;
}
.foot .sp { margin-inline-start:auto; }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .heat__grid { min-width:720px; }
}
@media (max-width: 820px) {
  .mast__in { padding-inline:var(--fw-space-4); }

  .view { padding-inline:var(--fw-space-4); }
  .crumb { display:none; }

  .glance { grid-template-columns:1fr 1fr; }
  .glance > div { border-inline-start:0; padding-inline-start:0; }
  .figrow, .statline { grid-template-columns:1fr 1fr; }
  .figrow > div + div, .statline > div + div { border-inline-start:0; }
  .formgrid { grid-template-columns:1fr 1fr; }
  .wow { grid-template-columns:1fr; }
  .index a { grid-template-columns:auto 1fr auto; }
  .index__fact { display:none; }
  .board { padding:var(--fw-space-4); border-radius:var(--fw-radius-surface); }
  .band__time { flex-basis:100%; margin-inline-start:0; }
}
@media (max-width: 480px) {
  .brand__scope { display:none; }
  .mbtn { padding:0 10px; font-size:13px; }

  .weektbl .row { grid-template-columns:1fr 1fr; }
  .weektbl .row .d { grid-column:1 / -1; }
  .actionzone .acts { margin-inline-start:0; width:100%; }
  .actionzone .acts .btn { flex:1; }
  .pop { inset-inline:12px; width:auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration:0.01ms !important; animation:none !important; }
}

function curveSVG(){
  const W = 960, H = 260, P = 28, X0 = 6, X1 = 23, Y1 = 120;
  const x = (t) => { const f = (t - X0) / (X1 - X0); return rtl() ? W - P - f * (W - 2 * P) : P + f * (W - 2 * P); };
  const y = (v) => H - P - (v / Y1) * (H - 2 * P);
  const pts = [...CURVE, CURVE_NOW];
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts[pts.length-1][0]).toFixed(1)},${y(0)} L${x(6).toFixed(1)},${y(0)} Z`;
  const ticks = [6, 9, 12, 15, 18, 21].map(h =>
    `<text x="${x(h)}" y="${H - 8}" font-size="11" fill="#aaa4a6" text-anchor="middle" class="num">${esc(fmtT(h, 0))}</text>`).join("");
  const grid = [30, 60, 90].map(v =>
    `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="#f5f3f2" stroke-opacity="0.07"/><text x="${rtl()? W - 8 : 8}" y="${y(v) + 4}" font-size="10" fill="#aaa4a6" class="num">${v}</text>`).join("");
  const dots = CURVE.map(p => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="2.4" fill="#ff2946"/>`).join("");
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(S().curveTitle)}">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e51935" stop-opacity="0.34"/><stop offset="1" stop-color="#4d0713" stop-opacity="0.05"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#cg)"/>
    <path d="${line}" fill="none" stroke="#ff2946" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <circle cx="${x(CURVE_NOW[0])}" cy="${y(CURVE_NOW[1])}" r="5.5" fill="#ff2946" stroke="#08090a" stroke-width="2"/>
    ${ticks}
  </svg>`;
}

        <input id="sCap" inputmode="numeric" value="${esc(d.cap)}" /><p class="err" id="eCap"></p></div>
      <div class="field" id="fDay"><label for="sDay">${esc(s.dayLabel)} <span class="unit">${esc(s.dayUnit)}</span></label>
        <input id="sDay" inputmode="numeric" placeholder="04:00" dir="ltr" value="${esc(d.day)}" /><p class="err" id="eDay"></p></div>
      <div class="field" id="fReset"><label for="sReset">${esc(s.resetLabel)} <span class="unit">(${esc(s.resetUnit)})</span></label>
        <input id="sReset" inputmode="numeric" value="${esc(d.reset)}" /><p class="err" id="eReset"></p></div>
    </div>
  </section>
  <section class="rail" aria-labelledby="thrH">
    <div class="rail__head"><h2 id="thrH">${esc(s.thrTitle)}</h2><p class="helper">${esc(s.thrHelper)}</p></div>
    <div class="formgrid">
      <div class="field" id="fQ"><label for="sQ">${esc(s.quietEnd)} <span class="unit">%</span></label>
        <input id="sQ" inputmode="numeric" value="${esc(d.q)}" /><p class="err" id="eQ"></p></div>
      <div class="field" id="fM"><label for="sM">${esc(s.modEnd)} <span class="unit">%</span></label>
        <input id="sM" inputmode="numeric" value="${esc(d.m)}" /><p class="err" id="eM"></p></div>
      <div class="field" id="fB"><label for="sB">${esc(s.busyEnd)} <span class="unit">%</span></label>
        <input id="sB" inputmode="numeric" value="${esc(d.b)}" /><p class="err" id="eB"></p></div>
    </div>
  </section>
  <section class="rail" aria-labelledby="weekH">
    <div class="rail__head"><h2 id="weekH">${esc(s.weekTitle)}</h2><p class="helper">${esc(s.weekHelper)}</p></div>
    <div class="weektbl">${weekRows}</div>
  </section>
  <section class="rail" aria-labelledby="lockH">
    <div class="rail__head"><h2 id="lockH">${esc(s.lockTitle)}</h2><p class="helper">${esc(s.lockHelper)}</p>
      <p class="rail__aside"><span class="statechip">${esc(s.lockBadge)}</span></p></div>
    <div class="formgrid" style="max-width:none">
      <div class="field"><label>${esc(s.lockTz)}</label><div class="ro"><bdi>${esc(s.lockTzValue)}</bdi></div></div>
      <div class="field"><label>${esc(s.lockPush)}</label><div class="ro num">${esc(s.sec(20))}</div></div>
      <div class="field"><label>${esc(s.lockFresh)}</label><div class="ro num">${esc(s.sec(90))}</div></div>
      <div class="field"><label>${esc(s.lockStale)}</label><div class="ro num">${esc(s.min(5))}</div></div>
      <div class="field"><label>${esc(s.lockPoll)}</label><div class="ro num">${esc(s.sec(30))}</div></div>
    </div>
    <p class="helper" style="margin-block-start:12px">${esc(s.lockFooter)}</p>
  </section>
  <div class="actionzone" id="saveBar">
    <p class="z"><b><span class="statechip ${dirty? "dirty":"saved"}" id="saveChip">${esc(dirty? s.stateDirty : s.stateSaved)}</span></b>${esc(s.lockFooter)}</p>
    <div class="acts">
      <button type="button" class="btn btn--ghost" id="discardBtn" ${dirty? "":"disabled"}>${esc(s.discard)}</button>
      <button type="submit" class="btn btn--primary" id="saveBtn">${esc(s.save)}</button>
    </div>
  </div>
  </form>`;
}

/* ================= dialogs ================= */
let dlgReturnFocus = null;
function openDialog(inner){
  dlgReturnFocus = document.activeElement;
  $("#dlgRoot").innerHTML = `<div class="dlg-veil open" id="dlgVeil">
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">${inner}</div>
  </div>`;
  const dlg = $(".dlg"); const first = $("input, button.btn--primary, button", dlg);
  (first || dlg).focus();
}
function closeDialog(){
  $("#dlgRoot").innerHTML = "";
  if (dlgReturnFocus) dlgReturnFocus.focus();
}
function pinDialog(mode){ // "rotate" | "deact"
  const s = S();
  const isR = mode === "rotate";
  openDialog(`
    <h3 id="dlgT">${esc(isR? s.pinRotateTitle : s.pinDeactTitle)}</h3>
    <p class="sub">${esc(isR? s.pinRotateSub : s.pinDeactSub)}</p>
    ${isR ? `<div class="field" id="dPinF"><label for="dPin">${esc(s.pinNewLabel)}</label>
      <input id="dPin" inputmode="numeric" dir="ltr" autocomplete="off" placeholder="6-12" />
      <p class="helper" style="font-size:12px">${esc(s.pinNewHint)}</p>
      <p class="err" id="dPinE"></p></div>` : ""}
    <div class="field" id="dWhyF" style="margin-block-start:16px"><label for="dWhy">${esc(s.reasonLabel)}</label>
      <input id="dWhy" type="text" autocomplete="off" />
      <p class="helper" style="font-size:12px">${esc(s.reasonHint)}</p>
      <p class="err" id="dWhyE">${esc(s.reasonErr)}</p></div>
    <div class="acts">
      <button type="button" class="btn btn--ghost" data-closedlg>${esc(s.cancel)}</button>
      <button type="button" class="btn ${isR? "btn--primary":"btn--danger"}" id="dlgOk">${esc(s.confirm)}</button>
    </div>`);
  $("#dlgOk").addEventListener("click", () => {
    let ok = true;
    if (isR){
      const v = $("#dPin").value.trim();
      const f = $("#dPinF"), e = $("#dPinE");
      if (!/^[0-9]{6,12}$/.test(v)){
        e.textContent = /[^0-9]/.test(v) ? s.pinErrDigits : s.pinErrLen;
        f.classList.add("invalid"); $("#dPin").setAttribute("aria-invalid","true"); ok = false;
      } else { f.classList.remove("invalid"); $("#dPin").removeAttribute("aria-invalid"); }
    }
    const why = $("#dWhy").value.trim();
    if (!why){ $("#dWhyF").classList.add("invalid"); $("#dWhy").setAttribute("aria-invalid","true"); ok = false; }
    else { $("#dWhyF").classList.remove("invalid"); $("#dWhy").removeAttribute("aria-invalid"); }
    if (!ok) return;
    state.pinActive = isR ? true : false;
    pushActivity(isR ? {ar:{who:"نورة", act:"غيّرت رمز وصول الموظفين"}, en:{who:"Noura", act:"Changed the staff access PIN"}}
                     : {ar:{who:"نورة", act:"أوقفت رمز وصول الموظفين"}, en:{who:"Noura", act:"Deactivated the staff access PIN"}}, why);
    closeDialog();
    toast(isR ? s.pinRotateDone : s.pinDeactDone);
    renderView();
  });
}
function pushActivity(act, why){
  const wAr = "الآن · 8:41 م", wEn = "Now · 8:41 PM";
  state.activity.unshift({ ar:{w:wAr, who:act.ar.who, act:act.ar.act, why}, en:{w:wEn, who:act.en.who, act:act.en.act, why}, sys:false });
}

/* ================= render + router ================= */
const VIEWS = { desk:viewDesk, daily:viewDaily, reports:viewReports, activity:viewActivity, system:viewSystem, access:viewAccess, settings:viewSettings };
function renderView(){
  if (state.surface === "settings" && !state.draft) state.draft = JSON.parse(JSON.stringify(state.saved));
  if (state.surface !== "settings") state.draft = null;
  $("#view").innerHTML = VIEWS[state.surface]();
  renderMast();
  const h = $("#pageTitle"); if (h) h.focus({ preventScroll:true });
}
function renderAll(){
  document.documentElement.lang = state.locale;
  document.documentElement.dir = rtl() ? "rtl" : "ltr";
  document.title = rtl() ? "FITWAY — الإدارة" : "FITWAY — Owner";
  $("#skip").textContent = S().skip;
  renderBand(); renderFoot(); renderView();
}
function go(id){
  if (!VIEWS[id]) id = "desk";
  state.surface = id;
  if (location.hash !== `#/${id}`) history.replaceState(null, "", `#/${id}`);
  renderPop(false); renderView();
  window.scrollTo(0, 0);
}
/* ================= events ================= */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go], #destBtn, #langBtn, #logoutBtn, [data-closepop], [data-closedlg], [data-cell], [data-preset], #csvBtn, #actMore, #actClear, #pinRotateBtn, #pinDeactBtn, #passToggle, #discardBtn");
  if (!t) return;
  if (t.dataset.go){ e.preventDefault(); go(t.dataset.go); toast(S().navTo(surfaceName(t.dataset.go))); return; }
  if (t.id === "destBtn"){
    const open = !$("#destPop"); renderPop(open);
    if (open){ const f = $("#destPop a"); if (f) f.focus(); }
    return;
  }
  if (t.id === "langBtn"){
    state.locale = rtl() ? "en" : "ar"; renderAll(); toast(S().langSwitched); return;
  }
  if (t.id === "logoutBtn"){ toast(rtl()? "هذه عينة ثابتة — لا جلسة حقيقية." : "Static fixture — no real session."); return; }
  if ("closepop" in t.dataset){ renderPop(false); const b = $("#destBtn"); if (b) b.focus(); return; }
  if ("closedlg" in t.dataset){ closeDialog(); return; }
  if (t.dataset.cell){
    const [d, h] = t.dataset.cell.split(",").map(Number);
    state.heatSel = { d, h };
    document.querySelectorAll("[data-cell]").forEach(b => b.setAttribute("aria-pressed", b === t ? "true" : "false"));
    $("#heatDetail").innerHTML = heatDetail(); return;
  }
  if (t.dataset.preset){ toast(S().rangeApplied); return; }
  if (t.id === "csvBtn"){
    const head = "day,hour,avg_occupancy\n";
    const body = HEAT.map((r, d) => r.map((v, h) => `${d},${HEAT_HOURS[h]},${v}`).join("\n")).join("\n");
    const url = URL.createObjectURL(new Blob(["\uFEFF" + head + body], { type:"text/csv" }));
    const a = Object.assign(document.createElement("a"), { href:url, download:"fitway-report-2026-08-19_2026-09-15.csv" });
    a.click(); URL.revokeObjectURL(url);
    pushActivity({ar:{who:"نورة", act:"صدّرت تقرير CSV"}, en:{who:"Noura", act:"Exported a CSV report"}}, rtl()? "نافذة 28 يوم عمل" : "28-business-day window");
    toast(rtl()? "تم تنزيل CSV. سُجّل الإجراء في سجل النشاط." : "CSV downloaded. The action is recorded in the Activity Log."); return;
  }
  if (t.id === "actMore"){ state.activity.push(...ACT_OLDER); state.olderLoaded = true; renderView(); toast(S().actLoaded); return; }
  if (t.id === "actClear"){ const sel = $("#fActor"); if (sel) sel.selectedIndex = 0; return; }
  if (t.id === "pinRotateBtn"){ pinDialog("rotate"); return; }
  if (t.id === "pinDeactBtn"){ pinDialog("deact"); return; }
  if (t.id === "passToggle"){
    const inp = $("#oPass"); const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    t.setAttribute("aria-pressed", String(show)); t.textContent = show ? S().hidePass : S().showPass; return;
  }
  if (t.id === "discardBtn"){ state.draft = JSON.parse(JSON.stringify(state.saved)); renderView(); return; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape"){
    if ($("#destPop")){ renderPop(false); const b = $("#destBtn"); if (b) b.focus(); }
    else if ($("#dlgVeil")) closeDialog();
  }
  const cell = e.target.closest ? e.target.closest("[data-cell]") : null;
  if (cell && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
    e.preventDefault();
    const [d, h] = cell.dataset.cell.split(",").map(Number);
    const dd = e.key === "ArrowUp" ? -1 : e.key === "ArrowDown" ? 1 : 0;
    const dh = e.key === "ArrowLeft" ? (rtl()? 1 : -1) : e.key === "ArrowRight" ? (rtl()? -1 : 1) : 0;
    const nd = Math.min(6, Math.max(0, d + dd)), nh = Math.min(17, Math.max(0, h + dh));
    const next = document.querySelector(`[data-cell="${nd},${nh}"]`);
    if (next){ next.focus(); next.click(); }
  }
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const s = S();
  if (e.target.id === "rangeForm"){ toast(s.rangeApplied); return; }
  if (e.target.id === "actForm"){ toast(rtl()? "طُبِّقت التصفية." : "Filters applied."); return; }
  if (e.target.id === "ownerForm"){
    let ok = true;
    const chk = (cond, f, inp) => {
      const F = $(f), I = $(inp);
      F.classList.toggle("invalid", !cond);
      if (cond) I.removeAttribute("aria-invalid"); else I.setAttribute("aria-invalid","true");
      if (!cond) ok = false;
    };
    chk(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($("#oEmail").value.trim()), "#fEmail", "#oEmail");
    chk($("#oName").value.trim().length > 0, "#fName", "#oName");
    chk($("#oPass").value.length >= 12 && $("#oPass").value.length <= 200, "#fPass", "#oPass");
    if (!ok) return;
    const name = $("#oName").value.trim(), email = $("#oEmail").value.trim();
    state.ownerCreated = { name, email };
    state.owners.push({ ar:name, en:name, role:{ar:"مالك", en:"Owner"}, since:{ar:"اليوم", en:"today"} });
    pushActivity({ar:{who:"نورة", act:"أنشأت حساب مالك"}, en:{who:"Noura", act:"Created an owner account"}}, `${name} · ${email}`);
    toast(s.ownerCreatedTitle);
    renderView(); return;
  }
  if (e.target.id === "setForm"){
    const d = state.draft;
    const int = (v) => /^[0-9]+$/.test(v.trim());
    const time = (v) => /^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(v.trim());
    const mark = (cond, f, inp, err, msg) => {
      const F = $(f), I = $(inp);
      F.classList.toggle("invalid", !cond);
      if (err && msg) $(err).textContent = msg;
      if (cond) I.removeAttribute("aria-invalid"); else I.setAttribute("aria-invalid","true");
      return cond;
    };
    let ok = true;
    ok = mark(d.cap.trim() !== "" && int(d.cap), "#fCap", "#sCap", "#eCap", d.cap.trim() === "" ? s.errRequired : s.errInt) && ok;
    ok = mark(time(d.day), "#fDay", "#sDay", "#eDay", s.errTime) && ok;
    ok = mark(d.reset.trim() !== "" && int(d.reset), "#fReset", "#sReset", "#eReset", s.errInt) && ok;
    const pct = (v) => int(v) && +v >= 0 && +v <= 100;
    ok = mark(pct(d.q), "#fQ", "#sQ", "#eQ", s.errRange) && ok;
    ok = mark(pct(d.m), "#fM", "#sM", "#eM", s.errRange) && ok;
    ok = mark(pct(d.b), "#fB", "#sB", "#eB", s.errRange) && ok;
    if (ok && +d.m <= +d.q) ok = mark(false, "#fM", "#sM", "#eM", s.errOrderMod(d.q)) && ok;
    if (ok && +d.b <= +d.m) ok = mark(false, "#fB", "#sB", "#eB", s.errOrderBusy(d.m)) && ok;
    if (!ok){ toast(s.invalidToast, true); return; }
    const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = s.saving;
    setTimeout(() => {
      state.saved = JSON.parse(JSON.stringify(d));
      pushActivity({ar:{who:"نورة", act:"حفظت الإعدادات"}, en:{who:"Noura", act:"Saved settings"}}, rtl()? "تحديث من صفحة الإعدادات" : "Updated from the Settings page");
      toast(s.savedToast);
      renderView();
    }, 450);
  }
});
/* settings draft tracking */
document.addEventListener("input", (e) => {
  if (state.surface !== "settings" || !state.draft) return;
  const map = { sCap:"cap", sDay:"day", sReset:"reset", sQ:"q", sM:"m", sB:"b" };
  if (map[e.target.id]){
    state.draft[map[e.target.id]] = e.target.value;
    const dirty = JSON.stringify(state.draft) !== JSON.stringify(state.saved);
    const chip = $("#saveChip");
    if (chip){ chip.textContent = dirty? S().stateDirty : S().stateSaved; chip.className = `statechip ${dirty? "dirty":"saved"}`; }
    const db = $("#discardBtn"); if (db) db.disabled = !dirty;
  }
});
document.addEventListener("change", (e) => {
  if (state.surface !== "settings" || !state.draft) return;
  const row = e.target.closest("[data-day]"); if (!row) return;
  const d = +row.dataset.day; const kind = e.target.dataset.h;
  if (kind === "closed"){
    state.draft.hours[d] = e.target.checked ? null : ["06:00","23:00"];
    renderView();
  } else if (kind === "open"){ state.draft.hours[d][0] = e.target.value; }
  else if (kind === "close"){ state.draft.hours[d][1] = e.target.value; }
});
window.addEventListener("hashchange", () => {
  const id = location.hash.replace(/^#\//, "");
  if (VIEWS[id] && id !== state.surface){ state.surface = id; renderView(); }
});

/* ================= init ================= */
const initial = location.hash.replace(/^#\//, "");
if (VIEWS[initial]) state.surface = initial;
renderAll();

</script>
