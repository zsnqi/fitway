    // A still. ?level=packed shows the same page at the highest level, with values that agree with it.
    (function () {

      var v = { word: "شديد الازدحام", count: "106", pct: "88%" };
      document.querySelector(".page").setAttribute("data-level", "4");
      document.querySelectorAll("[data-k]").forEach(function (el) {

        if (k === "mark") el.setAttribute("aria-label", "مستوى الازدحام: " + v.word);
