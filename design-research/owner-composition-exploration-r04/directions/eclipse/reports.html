<!doctype html>
<html lang="ar" dir="rtl" data-state="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FITWAY Eclipse Reports</title>
  <meta name="description" content="FITWAY Owner Reports page concept, Eclipse direction. Exploration concept with synthetic data. Not production.">
  <script>
    // Language and state before first paint: ?lang=ar|en (default ar), ?state=full|short (default full).
    // K-02 (decided 2026-10-03, DECISIONS item 14): ?state=loading|closed|delayed|unavailable|pending|error draws a page
    // state over the full history. Without a page state the page is the live page.
    (function () {
      var p = new URLSearchParams(location.search), r = document.documentElement;
      var en = p.get("lang") === "en", st = p.get("state");
      r.lang = en ? "en" : "ar";
      r.dir = en ? "ltr" : "rtl";
      r.dataset.state = st === "short" ? "short" : "full";
      if (["loading", "closed", "delayed", "unavailable", "pending", "error"].indexOf(st) >= 0) r.dataset.page = st;
    })();
  </script>
  <link rel="stylesheet" href="fonts/readex-pro.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reports.css">
  <script>
    // As on the Daily page: start the CSS faces themselves, so text shares their one fetch per subset.
    for (var weight of ["400", "500"]) {
      document.fonts.load(weight + ' 16px "Readex Pro"', "العربية FITWAY 0123456789")
        .catch(function () { /* Failed faces keep the existing fallback. */ });
    }
  </script>
  <script src="reports.js" defer blocking="render"></script>
</head>
<!-- data-frame (step 4): Reports takes the frame Daily took in step 3 (style.css "the frame"): the rail at 721 px and
     wider (it opens over the content, with a scrim from 721 to 1023 px), and at 720 px and below the compact header and
     the bar. Reports' own content below 1200 px is composed since step 4 phase B (reports.css, "below 1200 px"); below
     1280 px the pattern shows one day at a time (K-39) and, at 720 px and below, day by day is a list (step 4's build). -->
<body class="rp" data-frame>
  <a class="skip" href="#main" data-t="skip"></a>
  <div class="page">
    <i class="wash" aria-hidden="true"><i class="wash-light"></i></i>
    <!-- The tablet's scrim under the open rail (721-1023 px); a tap on it closes the rail. -->
    <div class="rail-scrim" id="rail-scrim" hidden></div>

    <div class="rail-slot">
      <nav class="rail" id="rail" data-open="false">
        <div class="rail-brand">
          <button class="rail-item brand" id="brand" type="button" aria-expanded="false" aria-controls="rail">
            <span class="tile">
              <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                <path class="mk" d="M20.6 50.4A23 23 0 1 0 13.6 43.4" stroke-width="4.4"/>
                <path class="mk" d="M24.2 20.8A13.6 13.6 0 1 1 26.4 44.2" stroke-width="4"/>
                <path class="mk" d="M19.4 21.4 30.2 32.2 14.6 47.8" stroke-width="4.2" stroke-linejoin="miter" stroke-linecap="butt"/>
                <circle class="mk-dot" cx="36" cy="28.2" r="4.2"/>
              </svg>
            </span>
            <span class="rail-name wordmark" lang="en">FITWAY</span>
            <span class="rail-tip" data-t="railTip" aria-hidden="true"></span>
          </button>
        </div>

        <ul class="rail-group">
          <li><a class="rail-item" href="index.html" id="daily-link" data-nav="daily">
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 13.5a7.5 7.5 0 0 1 15 0"/><path d="M12 13.5 15.6 9.9"/><path d="M3.5 18h17"/><circle class="fill" cx="12" cy="13.5" r="1.3"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item is-active" href="#main" aria-current="page" data-nav="reports">
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 19.5h16"/><path d="M7 16v-4.5M12 16V6.5M17 16v-7"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="activity" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="3.8" width="14" height="16.4" rx="3"/><path d="M8.6 8.6h6.8M8.6 12h6.8M8.6 15.4h4"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="access" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="8.2" cy="12" r="3.6"/><path d="M11.8 12h8.4M17.2 12v2.8M20.2 12v2"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
        </ul>

        <ul class="rail-group rail-foot">
          <li><a class="rail-item" href="#" data-nav="monitoring" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.6" y="4.6" width="16.8" height="11.4" rx="2.4"/><path d="M9 20h6M12 16v4"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" id="lang-link" data-nav="lang">
            <span class="tile tile-lang"><span class="glyph" id="lang-glyph"></span></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="settings" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.02 5.6 10.23 3.28A8.9 8.9 0 0 1 13.77 3.28L13.98 5.6A6.7 6.7 0 0 1 15.13 6.07L16.92 4.58A8.9 8.9 0 0 1 19.42 7.08L17.93 8.87A6.7 6.7 0 0 1 18.4 10.02L20.72 10.23A8.9 8.9 0 0 1 20.72 13.77L18.4 13.98A6.7 6.7 0 0 1 17.93 15.13L19.42 16.92A8.9 8.9 0 0 1 16.92 19.42L15.13 17.93A6.7 6.7 0 0 1 13.98 18.4L13.77 20.72A8.9 8.9 0 0 1 10.23 20.72L10.02 18.4A6.7 6.7 0 0 1 8.87 17.93L7.08 19.42A8.9 8.9 0 0 1 4.58 16.92L6.07 15.13A6.7 6.7 0 0 1 5.6 13.98L3.28 13.77A8.9 8.9 0 0 1 3.28 10.23L5.6 10.02A6.7 6.7 0 0 1 6.07 8.87L4.58 7.08A8.9 8.9 0 0 1 7.08 4.58L8.87 6.07A6.7 6.7 0 0 1 10.02 5.6Z"/><circle cx="12" cy="12" r="2.7"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="signout" data-inert>
            <span class="tile"><svg class="mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.5 4.5H7.2a2.2 2.2 0 0 0-2.2 2.2v10.6a2.2 2.2 0 0 0 2.2 2.2h6.3"/><path d="M10.5 12h9M16.5 8.8 19.7 12l-3.2 3.2"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
        </ul>
      </nav>
    </div>

    <main class="main" id="main" tabindex="-1">
      <header class="head">
        <div class="head-titles">
          <h1 data-t="title"></h1>
          <p class="sub" id="sub"></p>
        </div>
        <!-- The status column (HDR-6), the frame's: the Operations status, one control at every size that opens its
             details, then the concept label; at 720 px and below the menu joins the status (as on Daily). -->
        <div class="head-meta">
          <div class="head-acts">
            <!-- The status's slot (HDR-6, STW-2): from 721 px it is as wide as the widest status, which the unseen copies in
                 .hb-res hold, and the control, as wide as its own status, stands at its inline end (HDR-3). -->
            <span class="hb-slot" id="ops-slot">
              <span class="hb-res" id="ops-res" aria-hidden="true"></span>
              <button class="hbadge" id="ops-btn" type="button" aria-expanded="false" aria-controls="ops-pop" aria-haspopup="dialog">
                <span class="hb-state" id="ops-btn-state"></span>
                <svg class="hb-chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 10l5 5 5-5"/></svg>
              </button>
            </span>
            <div class="fw-pop ops-pop" id="ops-pop" role="dialog" aria-labelledby="ops-title" aria-describedby="ops-desc" tabindex="-1" hidden>
              <div class="ops-body">
                <h2 class="ops-title" id="ops-title" data-t="opsTitle"></h2>
                <div id="ops-desc">
                  <p class="ops-state" id="ops-state"></p>
                  <p class="ops-line" id="ops-last"></p>
                  <p class="ops-line" id="ops-hours"></p>
                </div>
              </div>
              <div class="ops-foot">
                <a class="fw-mi" href="#" id="ops-link" data-inert>
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 7.5h9M17.5 7.5h2M4.5 16.5h2M10.5 16.5h9"/><circle cx="15.5" cy="7.5" r="2"/><circle cx="8.5" cy="16.5" r="2"/></svg>
                  <span id="ops-link-name"></span>
                  <svg class="fw-mi-end mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 7l5 5-5 5"/></svg>
                </a>
              </div>
            </div>
            <button class="hbtn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu-pop" aria-haspopup="menu">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="fill" cx="5.5" cy="12" r="1.6"/><circle class="fill" cx="12" cy="12" r="1.6"/><circle class="fill" cx="18.5" cy="12" r="1.6"/></svg>
            </button>
            <div class="fw-pop menu-pop" id="menu-pop" role="menu" aria-labelledby="menu-btn" hidden>
              <a class="fw-mi" role="menuitem" tabindex="-1" href="#" id="menu-monitoring" data-inert>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.6" y="4.6" width="16.8" height="11.4" rx="2.4"/><path d="M9 20h6M12 16v4"/></svg>
                <span id="menu-monitoring-name"></span>
              </a>
              <a class="fw-mi" role="menuitem" tabindex="-1" href="#" id="menu-lang"><span class="fw-glyph" id="menu-lang-glyph" aria-hidden="true"></span><span id="menu-lang-name"></span></a>
              <a class="fw-mi" role="menuitem" tabindex="-1" href="#" id="menu-signout" data-inert>
                <svg class="mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.5 4.5H7.2a2.2 2.2 0 0 0-2.2 2.2v10.6a2.2 2.2 0 0 0 2.2 2.2h6.3"/><path d="M10.5 12h9M16.5 8.8 19.7 12l-3.2 3.2"/></svg>
                <span id="menu-signout-name"></span>
              </a>
            </div>
          </div>
          <span class="chip concept" data-t="concept"></span>
        </div>
      </header>

      <!-- The page's controls (step 4): the period alone at the row's start, and the minute file at its far end (HDR-7,
           TBL-10; user 2026-10-01). Everything below answers for the period, except "Last 7 days", which names its own
           span. -->
      <div class="rp-tools">
        <div class="seg" id="range-seg" role="group" aria-labelledby="range-seg-name">
          <span class="sr-only" id="range-seg-name" data-t="rangeName"></span>
          <button class="seg-b" type="button" data-range="7d" aria-pressed="false"></button>
          <button class="seg-b" type="button" data-range="28d" aria-pressed="false"></button>
          <button class="seg-b" type="button" data-range="custom" aria-pressed="false" aria-haspopup="dialog"></button>
        </div>
        <button class="rbtn" id="export-btn" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4.5v10.2M7.8 10.6 12 14.8l4.2-4.2"/><path d="M5 16.5v1.4a1.6 1.6 0 0 0 1.6 1.6h10.8a1.6 1.6 0 0 0 1.6-1.6v-1.4"/></svg>
          <span data-t="exportMinutes"></span>
        </button>
      </div>

      <!-- At a glance: the period's three figures share one card, under the period control; "Last 7 days" leaves their
           row and names its own span (TRU-1, TRU-7). -->
      <section class="rp-glance" id="cards" aria-labelledby="cards-title">
        <h2 class="sr-only" id="cards-title" data-t="glance"></h2>
        <article class="card rp-period" id="card-period" aria-labelledby="period-name">
          <h3 class="sr-only" id="period-name"></h3>
          <div class="fig" id="fig-avg">
            <div class="stat-head">
              <svg class="stat-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8.2" r="3.4"/><path d="M5.6 19.4a6.4 6.4 0 0 1 12.8 0"/></svg>
              <h4 class="stat-label" data-t="avgTitle"></h4>
            </div>
            <div class="fig-body" id="avg-body"></div>
          </div>
          <div class="fig" id="fig-peak">
            <div class="stat-head">
              <svg class="stat-ico mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 17.5 9.2 11l3.4 3.2L20 6.5"/><path d="M15.4 6.5H20v4.6"/></svg>
              <h4 class="stat-label" data-t="peakTitle"></h4>
              <span class="stat-meta" id="peak-meta"></span>
            </div>
            <div class="fig-body" id="peak-body"></div>
          </div>
          <div class="fig" id="fig-entries">
            <div class="stat-head">
              <svg class="stat-ico mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 4.5H6.8a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H10"/><path d="M20 12h-9M14.2 8.8 11 12l3.2 3.2"/></svg>
              <h4 class="stat-label" data-t="entriesTitle"></h4>
            </div>
            <div class="fig-body" id="entries-body"></div>
          </div>
        </article>

        <article class="card fig rp-trend" id="card-trend" aria-labelledby="trend-title">
          <i class="lamp" aria-hidden="true"><i class="lamp-in"><i class="lamp-rim"></i></i></i>
          <div class="stat-head">
            <!-- A span of days: a calendar, which has no direction and never mirrors (ICO-5); the direction is the badge's. -->
            <svg class="stat-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4.6" y="5.6" width="14.8" height="14" rx="2.6"/><path d="M4.6 10.2h14.8M8.6 3.8v3.6M15.4 3.8v3.6"/></svg>
            <h3 class="stat-label" id="trend-title" data-t="trendTitle"></h3>
            <span class="stat-meta" id="trend-meta"></span>
          </div>
          <div class="fig-body" id="trend-body"></div>
        </article>
      </section>

      <section class="card pattern lit lit-chart" id="pattern" aria-labelledby="pattern-title">
        <i class="lamp" aria-hidden="true"><i class="lamp-in"><i class="lamp-rim"></i></i></i>
        <header class="pattern-head">
          <div class="pattern-titles">
            <h2 id="pattern-title" data-t="patternTitle"></h2>
            <p class="pattern-sub" id="pattern-sub"></p>
          </div>
          <div class="pattern-tools">
            <ul class="heat-key" id="heat-key"></ul>
            <button class="switch" id="numbers" type="button" role="switch" aria-checked="false">
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              <span class="switch-label" data-t="numbers"></span>
            </button>
          </div>
        </header>
        <!-- Below 1280 px: one day at a time, the week strip and the chosen day's hours (reports.js, renderDay). -->
        <div class="pday" id="pday" hidden></div>
        <div class="heat-scroll" id="heat-scroll">
          <div class="heat-plate" id="heat-plate">
            <table class="heat" id="heat" role="grid" aria-labelledby="pattern-title" aria-describedby="pattern-sub heat-keys"></table>
          </div>
          <div class="tip heat-tip" id="heat-tip" hidden></div>
        </div>
        <p class="sr-only" id="heat-keys"></p>
      </section>

      <section class="card days" id="days" aria-labelledby="days-title">
        <header class="days-head">
          <div class="days-titles">
            <h2 id="days-title" data-t="daysTitle"></h2>
            <p class="days-sub" id="days-sub"></p>
          </div>
          <!-- TBL-10: the table's export exports the table's rows (K-14). -->
          <a class="rbtn" id="table-export" href="#" download>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4.5v10.2M7.8 10.6 12 14.8l4.2-4.2"/><path d="M5 16.5v1.4a1.6 1.6 0 0 0 1.6 1.6h10.8a1.6 1.6 0 0 0 1.6-1.6v-1.4"/></svg>
            <span data-t="exportTable"></span>
          </a>
        </header>
        <div class="table-wrap" id="days-wrap">
          <!-- At 720 px and below: the day list (reports.js, renderList); the table from 721 px. -->
          <div class="dlist" id="dlist" hidden></div>
          <table class="table days-table" id="days-table" role="table"></table>
        </div>
      </section>

      <p class="sr-only" id="say" aria-live="polite" aria-atomic="true"></p>
    </main>

    <!-- Phone (720 px and below): the rail becomes this glass bar at the bottom, five sections with a short name under
         each icon (as on Daily). After the main content, so the reading and Tab order runs top to bottom. -->
    <nav class="tabbar" id="tabbar">
      <ul>
        <li><a class="tb-item" href="index.html" id="tab-daily" data-tab="daily">
          <span class="tb-tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 13.5a7.5 7.5 0 0 1 15 0"/><path d="M12 13.5 15.6 9.9"/><path d="M3.5 18h17"/><circle class="fill" cx="12" cy="13.5" r="1.3"/></svg></span>
          <span class="tb-name"></span>
        </a></li>
        <li><a class="tb-item" href="#main" aria-current="page" data-tab="reports">
          <span class="tb-tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 19.5h16"/><path d="M7 16v-4.5M12 16V6.5M17 16v-7"/></svg></span>
          <span class="tb-name"></span>
        </a></li>
        <li><a class="tb-item" href="#" data-tab="activity" data-inert>
          <span class="tb-tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="3.8" width="14" height="16.4" rx="3"/><path d="M8.6 8.6h6.8M8.6 12h6.8M8.6 15.4h4"/></svg></span>
          <span class="tb-name"></span>
        </a></li>
        <li><a class="tb-item" href="#" data-tab="access" data-inert>
          <span class="tb-tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="8.2" cy="12" r="3.6"/><path d="M11.8 12h8.4M17.2 12v2.8M20.2 12v2"/></svg></span>
          <span class="tb-name"></span>
        </a></li>
        <li><a class="tb-item" href="#" data-tab="settings" data-inert>
          <span class="tb-tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.02 5.6 10.23 3.28A8.9 8.9 0 0 1 13.77 3.28L13.98 5.6A6.7 6.7 0 0 1 15.13 6.07L16.92 4.58A8.9 8.9 0 0 1 19.42 7.08L17.93 8.87A6.7 6.7 0 0 1 18.4 10.02L20.72 10.23A8.9 8.9 0 0 1 20.72 13.77L18.4 13.98A6.7 6.7 0 0 1 17.93 15.13L19.42 16.92A8.9 8.9 0 0 1 16.92 19.42L15.13 17.93A6.7 6.7 0 0 1 13.98 18.4L13.77 20.72A8.9 8.9 0 0 1 10.23 20.72L10.02 18.4A6.7 6.7 0 0 1 8.87 17.93L7.08 19.42A8.9 8.9 0 0 1 4.58 16.92L6.07 15.13A6.7 6.7 0 0 1 5.6 13.98L3.28 13.77A8.9 8.9 0 0 1 3.28 10.23L5.6 10.02A6.7 6.7 0 0 1 6.07 8.87L4.58 7.08A8.9 8.9 0 0 1 7.08 4.58L8.87 6.07A6.7 6.7 0 0 1 10.02 5.6Z"/><circle cx="12" cy="12" r="2.7"/></svg></span>
          <span class="tb-name"></span>
        </a></li>
      </ul>
    </nav>
  </div>

  <!-- The dialog system: one element per dialog, a scrim and a panel. Opened with showModal (the rest of the page is
       inert); reports.js keeps Tab inside, closes on Escape and returns focus to the control that opened it. -->
  <dialog class="dlg" id="dlg-range" aria-labelledby="dlg-range-title" aria-describedby="dlg-range-desc">
    <div class="dlg-scrim" data-close></div>
    <form class="dlg-panel" id="range-form" novalidate>
      <header class="dlg-head">
        <h2 id="dlg-range-title" data-t="rangeDlgTitle"></h2>
        <button class="icon-btn" type="button" data-close data-t-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7l10 10M17 7 7 17"/></svg>
        </button>
      </header>
      <div class="dlg-body">
        <p class="dlg-desc" id="dlg-range-desc"></p>
        <div class="field-row">
          <div class="field" id="rf-from"></div>
          <div class="field" id="rf-to"></div>
        </div>
        <p class="field-hint" id="rf-hint" data-t="dateHint"></p>
      </div>
      <footer class="dlg-foot">
        <button class="rbtn" type="button" data-close data-t="cancel"></button>
        <button class="rbtn rbtn-primary" type="submit" data-t="rangeApply"></button>
      </footer>
    </form>
  </dialog>

  <dialog class="dlg" id="dlg-export" aria-labelledby="dlg-export-title" aria-describedby="dlg-export-desc">
    <div class="dlg-scrim" data-close></div>
    <form class="dlg-panel" id="export-form" novalidate>
      <header class="dlg-head">
        <h2 id="dlg-export-title" data-t="exportTitle"></h2>
        <button class="icon-btn" type="button" data-close data-t-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7l10 10M17 7 7 17"/></svg>
        </button>
      </header>
      <div class="dlg-body" id="export-body">
        <p class="dlg-desc" id="dlg-export-desc" data-t="exportDesc"></p>
        <div class="export-edit" id="export-edit">
          <div class="field-row">
            <div class="field" id="ef-from"></div>
            <div class="field" id="ef-to"></div>
          </div>
          <p class="field-hint" id="ef-hint" data-t="dateHint"></p>
          <p class="file-line" id="export-file"></p>
        </div>
        <div class="progress" id="export-progress" role="status" hidden>
          <p class="progress-text" id="export-progress-text"></p>
          <span class="progress-bar" aria-hidden="true"><i id="export-progress-bar"></i></span>
        </div>
        <div class="alert" id="export-alert" role="alert" hidden></div>
        <div class="done" id="export-done" hidden></div>
      </div>
      <footer class="dlg-foot" id="export-foot">
        <button class="rbtn" type="button" id="export-cancel" data-close></button>
        <button class="rbtn rbtn-primary" type="submit" id="export-go"></button>
        <a class="rbtn rbtn-primary" id="export-save" hidden></a>
      </footer>
    </form>
  </dialog>
</body>
</html>
