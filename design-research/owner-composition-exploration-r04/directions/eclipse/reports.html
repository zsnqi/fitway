<!doctype html>
<html lang="ar" dir="rtl" data-state="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FITWAY Eclipse Reports</title>
  <meta name="description" content="FITWAY Owner Reports page concept, Eclipse direction. Exploration concept with synthetic data. Not production.">
  <script>
    // Language and state before first paint: ?lang=ar|en (default ar), ?state=full|short (default full).
    (function () {
      var p = new URLSearchParams(location.search), r = document.documentElement;
      var en = p.get("lang") === "en";
      r.lang = en ? "en" : "ar";
      r.dir = en ? "ltr" : "rtl";
      r.dataset.state = p.get("state") === "short" ? "short" : "full";
    })();
  </script>
  <link rel="stylesheet" href="fonts/readex-pro.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="reports.css">
  <script>
    // As on the Daily page: start the CSS faces themselves, so text shares their one fetch per subset.
    for (var weight of ["400", "500"]) {
      document.fonts.load(weight + ' 16px "Readex Pro"', "العربية FITWAY 0123456789")
        .catch(function () { /* Failed faces keep the existing fallback. */ });
    }
  </script>
  <script src="reports.js" defer blocking="render"></script>
</head>
<body class="rp">
  <a class="skip" href="#main" data-t="skip"></a>
  <div class="page">
    <i class="wash" aria-hidden="true"><i class="wash-light"></i></i>

    <div class="rail-slot">
      <nav class="rail" id="rail" data-open="false">
        <div class="rail-brand">
          <button class="rail-item brand" id="brand" type="button" aria-expanded="false" aria-controls="rail">
            <span class="tile">
              <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                <path class="mk" d="M20.6 50.4A23 23 0 1 0 13.6 43.4" stroke-width="4.4"/>
                <path class="mk" d="M24.2 20.8A13.6 13.6 0 1 1 26.4 44.2" stroke-width="4"/>
                <path class="mk" d="M19.4 21.4 30.2 32.2 14.6 47.8" stroke-width="4.2" stroke-linejoin="miter" stroke-linecap="butt"/>
                <circle class="mk-dot" cx="36" cy="28.2" r="4.2"/>
              </svg>
            </span>
            <span class="rail-name wordmark" lang="en">FITWAY</span>
            <span class="rail-tip" data-t="railTip" aria-hidden="true"></span>
          </button>
        </div>

        <ul class="rail-group">
          <li><a class="rail-item" href="index.html" id="daily-link" data-nav="daily">
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 13.5a7.5 7.5 0 0 1 15 0"/><path d="M12 13.5 15.6 9.9"/><path d="M3.5 18h17"/><circle class="fill" cx="12" cy="13.5" r="1.3"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item is-active" href="#main" aria-current="page" data-nav="reports">
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 19.5h16"/><path d="M7 16v-4.5M12 16V6.5M17 16v-7"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="access" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="8.2" cy="12" r="3.6"/><path d="M11.8 12h8.4M17.2 12v2.8M20.2 12v2"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="activity" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="3.8" width="14" height="16.4" rx="3"/><path d="M8.6 8.6h6.8M8.6 12h6.8M8.6 15.4h4"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="operations" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 7.5h9M17.5 7.5h2M4.5 16.5h2M10.5 16.5h9"/><circle cx="15.5" cy="7.5" r="2"/><circle cx="8.5" cy="16.5" r="2"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
        </ul>

        <ul class="rail-group rail-foot">
          <li><a class="rail-item" href="#" data-nav="monitoring" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.6" y="4.6" width="16.8" height="11.4" rx="2.4"/><path d="M9 20h6M12 16v4"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" id="lang-link" data-nav="lang">
            <span class="tile tile-lang"><span class="glyph" id="lang-glyph"></span></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="settings" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.02 5.6 10.23 3.28A8.9 8.9 0 0 1 13.77 3.28L13.98 5.6A6.7 6.7 0 0 1 15.13 6.07L16.92 4.58A8.9 8.9 0 0 1 19.42 7.08L17.93 8.87A6.7 6.7 0 0 1 18.4 10.02L20.72 10.23A8.9 8.9 0 0 1 20.72 13.77L18.4 13.98A6.7 6.7 0 0 1 17.93 15.13L19.42 16.92A8.9 8.9 0 0 1 16.92 19.42L15.13 17.93A6.7 6.7 0 0 1 13.98 18.4L13.77 20.72A8.9 8.9 0 0 1 10.23 20.72L10.02 18.4A6.7 6.7 0 0 1 8.87 17.93L7.08 19.42A8.9 8.9 0 0 1 4.58 16.92L6.07 15.13A6.7 6.7 0 0 1 5.6 13.98L3.28 13.77A8.9 8.9 0 0 1 3.28 10.23L5.6 10.02A6.7 6.7 0 0 1 6.07 8.87L4.58 7.08A8.9 8.9 0 0 1 7.08 4.58L8.87 6.07A6.7 6.7 0 0 1 10.02 5.6Z"/><circle cx="12" cy="12" r="2.7"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="signout" data-inert>
            <span class="tile"><svg class="mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.5 4.5H7.2a2.2 2.2 0 0 0-2.2 2.2v10.6a2.2 2.2 0 0 0 2.2 2.2h6.3"/><path d="M10.5 12h9M16.5 8.8 19.7 12l-3.2 3.2"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
        </ul>
      </nav>
    </div>

    <main class="main" id="main" tabindex="-1">
      <header class="head">
        <div class="head-titles">
          <h1 data-t="title"></h1>
          <p class="sub" id="sub"></p>
        </div>
        <div class="head-meta">
          <div class="seg" id="range-seg" role="group" aria-labelledby="range-seg-name">
            <span class="sr-only" id="range-seg-name" data-t="rangeName"></span>
            <button class="seg-b" type="button" data-range="7d" aria-pressed="false"></button>
            <button class="seg-b" type="button" data-range="28d" aria-pressed="false"></button>
            <button class="seg-b" type="button" data-range="custom" aria-pressed="false" aria-haspopup="dialog"></button>
          </div>
          <span class="chip concept" data-t="concept"></span>
        </div>
      </header>

      <section class="cards rp-cards" id="cards" aria-labelledby="cards-title">
        <h2 class="sr-only" id="cards-title" data-t="glance"></h2>

        <article class="card stat lit lit-card" id="card-wow">
          <i class="lamp" aria-hidden="true"><i class="lamp-in"><i class="lamp-rim"></i></i></i>
          <div class="stat-head">
            <span class="itile" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 16.5l5.2-5.2 3.6 3.6L20 7.7"/><path d="M14.6 7.7H20v5.4"/></svg></span>
            <h3 class="stat-label" data-t="wowTitle"></h3>
            <span class="stat-meta" id="wow-meta"></span>
          </div>
          <div class="stat-body" id="wow-body"></div>
        </article>

        <article class="card stat" id="card-avg">
          <div class="stat-head">
            <span class="itile" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.4"/><path d="M5.6 19.4a6.4 6.4 0 0 1 12.8 0"/></svg></span>
            <h3 class="stat-label" data-t="avgTitle"></h3>
          </div>
          <div class="stat-body" id="avg-body"></div>
        </article>

        <article class="card stat" id="card-peak">
          <div class="stat-head">
            <span class="itile" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17.5 9.2 11l3.4 3.2L20 6.5"/><path d="M15.4 6.5H20v4.6"/></svg></span>
            <h3 class="stat-label" data-t="peakTitle"></h3>
            <span class="stat-meta" id="peak-meta"></span>
          </div>
          <div class="stat-body" id="peak-body"></div>
        </article>

        <article class="card stat" id="card-entries">
          <div class="stat-head">
            <span class="itile" aria-hidden="true"><svg class="mirror" viewBox="0 0 24 24"><path d="M10 4.5H6.8a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H10"/><path d="M20 12h-9M14.2 8.8 11 12l3.2 3.2"/></svg></span>
            <h3 class="stat-label" data-t="entriesTitle"></h3>
          </div>
          <div class="stat-body" id="entries-body"></div>
        </article>
      </section>

      <section class="card pattern lit lit-chart" id="pattern" aria-labelledby="pattern-title">
        <i class="lamp" aria-hidden="true"><i class="lamp-in"><i class="lamp-rim"></i></i></i>
        <header class="pattern-head">
          <div class="pattern-titles">
            <h2 id="pattern-title" data-t="patternTitle"></h2>
            <p class="pattern-sub" id="pattern-sub"></p>
          </div>
          <div class="pattern-tools">
            <ul class="key heat-key" id="heat-key"></ul>
            <button class="switch" id="numbers" type="button" role="switch" aria-checked="false">
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              <span class="switch-label" data-t="numbers"></span>
            </button>
          </div>
        </header>
        <div class="heat-scroll" id="heat-scroll">
          <div class="heat-plate" id="heat-plate">
            <table class="heat" id="heat" role="grid" aria-labelledby="pattern-title" aria-describedby="pattern-sub heat-keys"></table>
          </div>
          <div class="tip heat-tip" id="heat-tip" hidden></div>
        </div>
        <p class="sr-only" id="heat-keys"></p>
      </section>

      <section class="card days" id="days" aria-labelledby="days-title">
        <header class="days-head">
          <div class="days-titles">
            <h2 id="days-title" data-t="daysTitle"></h2>
            <p class="days-sub" id="days-sub"></p>
          </div>
          <button class="rbtn" id="export-btn" type="button" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4.5v10.2M7.8 10.6 12 14.8l4.2-4.2"/><path d="M5 16.5v1.4a1.6 1.6 0 0 0 1.6 1.6h10.8a1.6 1.6 0 0 0 1.6-1.6v-1.4"/></svg>
            <span data-t="exportBtn"></span>
          </button>
        </header>
        <div class="table-wrap" id="days-wrap">
          <table class="table days-table" id="days-table" role="table"></table>
        </div>
      </section>

      <p class="sr-only" id="say" aria-live="polite" aria-atomic="true"></p>
    </main>
  </div>

  <!-- The dialog system: one element per dialog, a scrim and a panel. Opened with showModal (the rest of the page is
       inert); reports.js keeps Tab inside, closes on Escape and returns focus to the control that opened it. -->
  <dialog class="dlg" id="dlg-range" aria-labelledby="dlg-range-title" aria-describedby="dlg-range-desc">
    <div class="dlg-scrim" data-close></div>
    <form class="dlg-panel" id="range-form" novalidate>
      <header class="dlg-head">
        <h2 id="dlg-range-title" data-t="rangeDlgTitle"></h2>
        <button class="icon-btn" type="button" data-close data-t-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7l10 10M17 7 7 17"/></svg>
        </button>
      </header>
      <div class="dlg-body">
        <p class="dlg-desc" id="dlg-range-desc"></p>
        <div class="field-row">
          <div class="field" id="rf-from"></div>
          <div class="field" id="rf-to"></div>
        </div>
        <p class="field-hint" id="rf-hint" data-t="dateHint"></p>
      </div>
      <footer class="dlg-foot">
        <button class="rbtn" type="button" data-close data-t="cancel"></button>
        <button class="rbtn rbtn-primary" type="submit" data-t="rangeApply"></button>
      </footer>
    </form>
  </dialog>

  <dialog class="dlg" id="dlg-export" aria-labelledby="dlg-export-title" aria-describedby="dlg-export-desc">
    <div class="dlg-scrim" data-close></div>
    <form class="dlg-panel" id="export-form" novalidate>
      <header class="dlg-head">
        <h2 id="dlg-export-title" data-t="exportTitle"></h2>
        <button class="icon-btn" type="button" data-close data-t-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7l10 10M17 7 7 17"/></svg>
        </button>
      </header>
      <div class="dlg-body" id="export-body">
        <p class="dlg-desc" id="dlg-export-desc" data-t="exportDesc"></p>
        <div class="export-edit" id="export-edit">
          <div class="field-row">
            <div class="field" id="ef-from"></div>
            <div class="field" id="ef-to"></div>
          </div>
          <p class="field-hint" id="ef-hint" data-t="dateHint"></p>
          <p class="file-line" id="export-file"></p>
        </div>
        <div class="progress" id="export-progress" role="status" hidden>
          <p class="progress-text" id="export-progress-text"></p>
          <span class="progress-bar" aria-hidden="true"><i id="export-progress-bar"></i></span>
        </div>
        <div class="alert" id="export-alert" role="alert" hidden></div>
        <div class="done" id="export-done" hidden></div>
      </div>
      <footer class="dlg-foot" id="export-foot">
        <button class="rbtn" type="button" id="export-cancel" data-close></button>
        <button class="rbtn rbtn-primary" type="submit" id="export-go"></button>
        <a class="rbtn rbtn-primary" id="export-save" hidden></a>
      </footer>
    </form>
  </dialog>
</body>
</html>
