<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070707">
  <title>FITWAY</title>
  <meta name="description" content="FITWAY public crowd page, sketch 8 (public-redesign-r01): the narrowed direction from B4, English, live at Busy. Concept only, synthetic data, a still. Not production.">
  <link rel="stylesheet" href="public-sketch-8.css">
</head>
<body>
  <div class="page" data-light="now">
    <div class="light" aria-hidden="true"></div>
    <header class="top">
      <span class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <path class="mk" d="M20.6 50.4A23 23 0 1 0 13.6 43.4" stroke-width="4.4"/>
          <path class="mk" d="M24.2 20.8A13.6 13.6 0 1 1 26.4 44.2" stroke-width="4"/>
          <path class="mk" d="M19.4 21.4 30.2 32.2 14.6 47.8" stroke-width="4.2" stroke-linejoin="miter" stroke-linecap="butt"/>
          <circle class="mk-dot" cx="36" cy="28.2" r="4.2"/>
        </svg>
        <span class="wordmark">FITWAY</span>
      </span>
      <a class="lang" href="#" lang="ar" hreflang="ar">العربية</a>
    </header>

    <main class="sign">
      <h1 class="word" data-probe="word"><span class="sr-only">Crowd right now: </span>Busy</h1>

      <div class="facts" data-probe="facts">
        <p class="count-line"><span class="about">About</span> <bdi class="num count">70</bdi> <span class="inside">inside now</span></p>
        <p class="pct" data-probe="pct"><bdi class="num">58%</bdi> <span>full</span></p>
      </div>

      <figure class="day" data-probe="day" role="img" aria-label="Today by the half hour, from 6:00 AM to now, then the usual Friday until 1:00 AM">
        <div class="plot" aria-hidden="true">
          <div class="glow" data-probe="glow"><i class="g1"></i><i class="g2"></i></div>
          <div class="bars" data-probe="bars"></div>
          <p class="usual-label" data-probe="usual">Usual Friday</p>
        </div>
        <div class="axis" aria-hidden="true">
          <span class="t t-start" style="--m: 0">6 AM</span>
          <span class="t" style="--m: 360">12 PM</span>
          <span class="t" style="--m: 720">6 PM</span>
          <span class="t t-now" style="--m: 825" data-probe="now">Now</span>
          <span class="t" style="--m: 1080">12 AM</span>
        </div>
      </figure>

      <p class="best" data-probe="best">Usually quieter after <bdi class="num">10 PM</bdi></p>

      <footer class="stamp" data-probe="stamp">
        <p class="fresh"><i class="dot" aria-hidden="true"></i><span>Live · Last reading <bdi class="num">7:41</bdi>&nbsp;PM</span></p>
        <p class="open">Open until <bdi class="num">1:00</bdi>&nbsp;AM</p>
      </footer>
    </main>
  </div>
  <script src="public-sketch-8.js"></script>
</body>
</html>
