<!doctype html>
<html lang="ar" dir="rtl" data-state="live">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FITWAY Eclipse</title>
  <meta name="description" content="FITWAY Owner Daily page concept, Eclipse direction. Exploration concept with synthetic data. Not production.">
  <script>
    // Language and state before first paint: ?lang=ar|en (default ar),
    // ?state=live|delayed|nohistory|loading|closed|unavailable|error (default live; step 3 adds the last four).
    (function () {
      var p = new URLSearchParams(location.search), r = document.documentElement;
      var en = p.get("lang") === "en";
      r.lang = en ? "en" : "ar";
      r.dir = en ? "ltr" : "rtl";
      var s = p.get("state");
      r.dataset.state = ["delayed", "nohistory", "loading", "closed", "unavailable", "error"].indexOf(s) >= 0 ? s : "live";
      // Nothing is hidden before first paint: the page is complete at once (Round 6). Motion is decided in app.js.
    })();
  </script>
  <link rel="stylesheet" href="fonts/readex-pro.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Start the CSS faces themselves; their load is shared with text rendering.
    // Both weights use the same subset bytes; Arabic digits need Latin too.
    for (var weight of ["400", "500"]) {
      document.fonts.load(weight + ' 16px "Readex Pro"', "العربية FITWAY 0123456789")
        .catch(function () { /* Failed faces keep the existing fallback. */ });
    }
  </script>
  <script src="app.js" defer blocking="render"></script>
  <!-- Light tuner: a working tool for this concept (not part of the design). ?tuner=0 turns it off. -->
  <script src="tuner.js" defer blocking="render"></script>
</head>
<!-- data-frame: this page uses the responsive frame of step 3 (style.css "the frame"): the rail at 721 px and wider (it
     opens over the content, with a scrim from 721 to 1023 px), and at 720 px and below the compact header and the bar. -->
<body class="dl" data-frame>
  <a class="skip" href="#main" data-t="skip"></a>
  <div class="page">
    <!-- The page's own top-corner wash: part of the page box, scrolls with it, never fixed to the viewport. -->
    <i class="wash" aria-hidden="true"><i class="wash-light"></i></i>
    <!-- The tablet's scrim under the open rail (721-1023 px); a tap on it closes the rail. -->
    <div class="rail-scrim" id="rail-scrim" hidden></div>

    <div class="rail-slot">
      <nav class="rail" id="rail" data-open="false">
        <div class="rail-brand">
          <button class="rail-item brand" id="brand" type="button" aria-expanded="false" aria-controls="rail">
            <span class="tile">
              <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                <path class="mk" d="M20.6 50.4A23 23 0 1 0 13.6 43.4" stroke-width="4.4"/>
                <path class="mk" d="M24.2 20.8A13.6 13.6 0 1 1 26.4 44.2" stroke-width="4"/>
                <path class="mk" d="M19.4 21.4 30.2 32.2 14.6 47.8" stroke-width="4.2" stroke-linejoin="miter" stroke-linecap="butt"/>
                <circle class="mk-dot" cx="36" cy="28.2" r="4.2"/>
              </svg>
            </span>
            <span class="rail-name wordmark" lang="en">FITWAY</span>
            <span class="rail-tip" data-t="railTip" aria-hidden="true"></span>
          </button>
        </div>

        <ul class="rail-group">
          <li><a class="rail-item is-active" href="#main" aria-current="page" data-nav="daily">
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 13.5a7.5 7.5 0 0 1 15 0"/><path d="M12 13.5 15.6 9.9"/><path d="M3.5 18h17"/><circle class="fill" cx="12" cy="13.5" r="1.3"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="reports.html" id="reports-link" data-nav="reports">
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 19.5h16"/><path d="M7 16v-4.5M12 16V6.5M17 16v-7"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="activity.html" id="activity-link" data-nav="activity">
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="3.8" width="14" height="16.4" rx="3"/><path d="M8.6 8.6h6.8M8.6 12h6.8M8.6 15.4h4"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="access" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="8.2" cy="12" r="3.6"/><path d="M11.8 12h8.4M17.2 12v2.8M20.2 12v2"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
        </ul>

        <ul class="rail-group rail-foot">
          <li><a class="rail-item" href="#" data-nav="monitoring" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.6" y="4.6" width="16.8" height="11.4" rx="2.4"/><path d="M9 20h6M12 16v4"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" id="lang-link" data-nav="lang">
            <span class="tile tile-lang"><span class="glyph" id="lang-glyph"></span></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="settings" data-inert>
            <span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.02 5.6 10.23 3.28A8.9 8.9 0 0 1 13.77 3.28L13.98 5.6A6.7 6.7 0 0 1 15.13 6.07L16.92 4.58A8.9 8.9 0 0 1 19.42 7.08L17.93 8.87A6.7 6.7 0 0 1 18.4 10.02L20.72 10.23A8.9 8.9 0 0 1 20.72 13.77L18.4 13.98A6.7 6.7 0 0 1 17.93 15.13L19.42 16.92A8.9 8.9 0 0 1 16.92 19.42L15.13 17.93A6.7 6.7 0 0 1 13.98 18.4L13.77 20.72A8.9 8.9 0 0 1 10.23 20.72L10.02 18.4A6.7 6.7 0 0 1 8.87 17.93L7.08 19.42A8.9 8.9 0 0 1 4.58 16.92L6.07 15.13A6.7 6.7 0 0 1 5.6 13.98L3.28 13.77A8.9 8.9 0 0 1 3.28 10.23L5.6 10.02A6.7 6.7 0 0 1 6.07 8.87L4.58 7.08A8.9 8.9 0 0 1 7.08 4.58L8.87 6.07A6.7 6.7 0 0 1 10.02 5.6Z"/><circle cx="12" cy="12" r="2.7"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
          <li><a class="rail-item" href="#" data-nav="signout" data-inert>
            <span class="tile"><svg class="mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.5 4.5H7.2a2.2 2.2 0 0 0-2.2 2.2v10.6a2.2 2.2 0 0 0 2.2 2.2h6.3"/><path d="M10.5 12h9M16.5 8.8 19.7 12l-3.2 3.2"/></svg></span>
            <span class="rail-name"></span>
          </a></li>
        </ul>
      </nav>
    </div>

    <main class="main" id="main" tabindex="-1">
      <div class="fold">
      <header class="head">
        <div class="head-titles">
          <h1 data-t="title"></h1>
          <p class="sub" id="sub"></p>
        </div>
        <!-- The status column (HDR-6): the frame's Operations status, one control at every size that opens its details
             (step 4: Operations has no section in the rail). At 721 px and wider the status reads in full; at 720 px and
             below it is the compact badge, and the menu (the language, Monitoring and sign out) joins it. -->
        <div class="head-meta">
          <div class="head-acts">
            <!-- The status's slot (HDR-6, STW-2): from 721 px it is as wide as the widest status, which the unseen copies in
                 .hb-res hold, and the control, as wide as its own status, stands at its inline end (HDR-3). -->
            <span class="hb-slot" id="ops-slot">
              <span class="hb-res" id="ops-res" aria-hidden="true"></span>
              <button class="hbadge" id="ops-btn" type="button" aria-expanded="false" aria-controls="ops-pop" aria-haspopup="dialog">
                <span class="hb-state" id="ops-btn-state"></span>
                <svg class="hb-chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 10l5 5 5-5"/></svg>
              </button>
            </span>
            <div class="fw-pop ops-pop" id="ops-pop" role="dialog" aria-labelledby="ops-title" aria-describedby="ops-desc" tabindex="-1" hidden>
              <div class="ops-body">
                <h2 class="ops-title" id="ops-title" data-t="opsTitle"></h2>
                <div id="ops-desc">
                  <p class="ops-state" id="ops-state"></p>
                  <p class="ops-line" id="ops-last"></p>
                  <p class="ops-line" id="ops-hours"></p>
                </div>
              </div>
              <div class="ops-foot">
                <a class="fw-mi" href="#" id="ops-link" data-inert>
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 7.5h9M17.5 7.5h2M4.5 16.5h2M10.5 16.5h9"/><circle cx="15.5" cy="7.5" r="2"/><circle cx="8.5" cy="16.5" r="2"/></svg>
                  <span id="ops-link-name"></span>
                  <svg class="fw-mi-end mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 7l5 5-5 5"/></svg>
                </a>
              </div>
            </div>
            <button class="hbtn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu-pop" aria-haspopup="menu">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle class="fill" cx="5.5" cy="12" r="1.6"/><circle class="fill" cx="12" cy="12" r="1.6"/><circle class="fill" cx="18.5" cy="12" r="1.6"/></svg>
            </button>
            <div class="fw-pop menu-pop" id="menu-pop" role="menu" aria-labelledby="menu-btn" hidden>
              <a class="fw-mi" role="menuitem" tabindex="-1" href="#" id="menu-monitoring" data-inert>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.6" y="4.6" width="16.8" height="11.4" rx="2.4"/><path d="M9 20h6M12 16v4"/></svg>
                <span id="menu-monitoring-name"></span>
              </a>
              <a class="fw-mi" role="menuitem" tabindex="-1" href="#" id="menu-lang"><span class="fw-glyph" id="menu-lang-glyph" aria-hidden="true"></span><span id="menu-lang-name"></span></a>
              <a class="fw-mi" role="menuitem" tabindex="-1" href="#" id="menu-signout" data-inert>
                <svg class="mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.5 4.5H7.2a2.2 2.2 0 0 0-2.2 2.2v10.6a2.2 2.2 0 0 0 2.2 2.2h6.3"/><path d="M10.5 12h9M16.5 8.8 19.7 12l-3.2 3.2"/></svg>
                <span id="menu-signout-name"></span>
              </a>
            </div>
          </div>
        </div>
      </header>

      <section class="cards" id="cards">
        <h2 class="sr-only" id="cards-title" data-t="glance"></h2>
        <!-- One polite live region: a new reading is announced once, as whole figures, never digit by digit. -->
        <p class="sr-only" id="live-say" aria-live="polite" aria-atomic="true"></p>

        <article class="card stat lit lit-card" id="card-now">
          <i class="lamp" aria-hidden="true"><i class="lamp-in"><i class="lamp-rim"></i></i></i>
          <div class="stat-head">
            <svg class="stat-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8.2" r="3.4"/><path d="M5.6 19.4a6.4 6.4 0 0 1 12.8 0"/></svg>
            <h3 class="stat-label" id="now-label"></h3>
            <span class="stat-meta" id="now-meta"></span>
          </div>
          <p class="stat-value"><bdi class="num" id="now-v"></bdi><span class="unit" data-t="approx"></span></p>
          <div class="stat-foot" id="now-foot"></div>
        </article>

        <article class="card stat" id="card-peak">
          <div class="stat-head">
            <svg class="stat-ico mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 17.5 9.2 11l3.4 3.2L20 6.5"/><path d="M15.4 6.5H20v4.6"/></svg>
            <h3 class="stat-label" data-t="peakTitle"></h3>
            <span class="stat-meta" id="peak-meta"></span>
          </div>
          <p class="stat-value"><bdi class="num" id="peak-v"></bdi></p>
          <div class="stat-foot" id="peak-foot"></div>
        </article>

        <article class="card stat" id="card-entries">
          <div class="stat-head">
            <svg class="stat-ico mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 4.5H6.8a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H10"/><path d="M20 12h-9M14.2 8.8 11 12l3.2 3.2"/></svg>
            <h3 class="stat-label" data-t="entriesTitle"></h3>
          </div>
          <p class="stat-value"><bdi class="num" id="entries-v"></bdi></p>
          <p class="stat-note" id="entries-usual"></p>
        </article>

        <article class="card stat" id="card-busiest">
          <div class="stat-head">
            <svg class="stat-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7.6"/><path d="M12 7.8V12l2.8 1.8"/></svg>
            <h3 class="stat-label" data-t="busiestTitle"></h3>
            <span class="stat-meta" id="busy-meta"></span>
          </div>
          <p class="stat-value"><span class="num word" id="busy-v"></span></p>
          <p class="stat-note" id="busy-note"></p>
        </article>
      </section>

      <section class="card chart lit lit-chart" aria-labelledby="chart-title">
        <i class="lamp" aria-hidden="true"><i class="lamp-in"><i class="lamp-rim"></i></i></i>
        <header class="chart-head">
          <h2 id="chart-title" data-t="chartTitle"></h2>
          <div class="chart-tools">
            <ul class="key" id="key"></ul>
            <button class="btn" id="details-btn" type="button" aria-expanded="false" aria-controls="details">
              <span data-t="details"></span>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 10l5 5 5-5"/></svg>
            </button>
          </div>
        </header>
        <figure class="plot" id="plot">
          <div class="plot-svg" id="plot-svg"></div>
          <div class="plot-labels" id="plot-labels"></div>
          <div class="tip" id="tip" hidden></div>
          <div class="plot-hit" id="plot-hit" role="slider" tabindex="0" aria-describedby="chart-summary chart-keys"></div>
          <!-- The phone's reading (720 px and below; decision 20's trial): the stop a finger holds, taps or the keys reach,
               large in the band above the plot, in place of the tooltip. A kept reading adds its buttons: the previous and
               the next time on the lower row, close above the next. After the plot, so Tab reaches the plot, then the
               buttons, in a path with no diagonal (decision 25): previous, next, then up to close. -->
          <div class="band" id="band" hidden>
            <div class="band-read" id="band-read" aria-hidden="true"></div>
            <div class="band-acts" id="band-acts" hidden>
              <button class="band-btn band-prev" id="band-prev" type="button"><svg class="mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 6.5 9 12l5.5 5.5"/></svg></button>
              <button class="band-btn band-next" id="band-next" type="button"><svg class="mirror" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 6.5 15 12l-5.5 5.5"/></svg></button>
              <button class="band-btn band-close" id="band-close" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
            </div>
          </div>
        </figure>
        <p class="sr-only" id="chart-summary"></p>
        <p class="sr-only" id="chart-keys"></p>
        <p class="sr-only" id="band-say" aria-live="polite" aria-atomic="true"></p>
      </section>
      </div>

      <section class="card details" id="details" hidden aria-labelledby="details-title">
        <h2 id="details-title" data-t="detailsTitle"></h2>
        <div class="details-grid">
          <div class="coverage" id="coverage"></div>
          <div class="minutes" id="minutes"></div>
        </div>
      </section>
    </main>

    <!-- Phone (720 px and below): the rail becomes this glass bar at the bottom, five sections with a short name under
         each icon. After the main content, so the reading and Tab order runs top to bottom. -->
    <nav class="tabbar" id="tabbar">
      <ul>
        <li><a class="tb-item" href="#main" aria-current="page" data-tab="daily">
          <span class="tb-tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 13.5a7.5 7.5 0 0 1 15 0"/><path d="M12 13.5 15.6 9.9"/><path d="M3.5 18h17"/><circle class="fill" cx="12" cy="13.5" r="1.3"/></svg></span>
          <span class="tb-name"></span>
        </a></li>
        <li><a class="tb-item" href="reports.html" id="tab-reports" data-tab="reports">
          <span class="tb-tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 19.5h16"/><path d="M7 16v-4.5M12 16V6.5M17 16v-7"/></svg></span>
          <span class="tb-name"></span>
        </a></li>
        <li><a class="tb-item" href="activity.html" id="tab-activity" data-tab="activity">
          <span class="tb-tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="3.8" width="14" height="16.4" rx="3"/><path d="M8.6 8.6h6.8M8.6 12h6.8M8.6 15.4h4"/></svg></span>
          <span class="tb-name"></span>
        </a></li>
        <li><a class="tb-item" href="#" data-tab="access" data-inert>
          <span class="tb-tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="8.2" cy="12" r="3.6"/><path d="M11.8 12h8.4M17.2 12v2.8M20.2 12v2"/></svg></span>
          <span class="tb-name"></span>
        </a></li>
        <li><a class="tb-item" href="#" data-tab="settings" data-inert>
          <span class="tb-tile"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.02 5.6 10.23 3.28A8.9 8.9 0 0 1 13.77 3.28L13.98 5.6A6.7 6.7 0 0 1 15.13 6.07L16.92 4.58A8.9 8.9 0 0 1 19.42 7.08L17.93 8.87A6.7 6.7 0 0 1 18.4 10.02L20.72 10.23A8.9 8.9 0 0 1 20.72 13.77L18.4 13.98A6.7 6.7 0 0 1 17.93 15.13L19.42 16.92A8.9 8.9 0 0 1 16.92 19.42L15.13 17.93A6.7 6.7 0 0 1 13.98 18.4L13.77 20.72A8.9 8.9 0 0 1 10.23 20.72L10.02 18.4A6.7 6.7 0 0 1 8.87 17.93L7.08 19.42A8.9 8.9 0 0 1 4.58 16.92L6.07 15.13A6.7 6.7 0 0 1 5.6 13.98L3.28 13.77A8.9 8.9 0 0 1 3.28 10.23L5.6 10.02A6.7 6.7 0 0 1 6.07 8.87L4.58 7.08A8.9 8.9 0 0 1 7.08 4.58L8.87 6.07A6.7 6.7 0 0 1 10.02 5.6Z"/><circle cx="12" cy="12" r="2.7"/></svg></span>
          <span class="tb-name"></span>
        </a></li>
      </ul>
    </nav>
  </div>
</body>
</html>
