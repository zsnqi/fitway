affectedRegion: Owner Daily occupancy chart line between exact minute observations.
observableProblem: Unbounded cubic controls can visually overshoot both observations, including
  bending a true plateau beyond its recorded value. That conflicts with the accepted chart language
  and the repository requirement that smoothing never invent or hide occupancy movement.
smallestCorrection: Keep the accepted smooth connected line, point positions, axes, interaction, and
  composition, but clamp each cubic segment's control ordinates to the range of its two observed
  endpoints. A flat segment therefore remains flat and every curved segment remains inside its data
  bounds.
mustPreserve:
  - exact minute point positions and semantic values
  - zero, missing, and scheduled-closed distinctions
  - RTL/LTR timeline direction and keyboard interaction
  - accepted chart color, weight, density, and surrounding composition
