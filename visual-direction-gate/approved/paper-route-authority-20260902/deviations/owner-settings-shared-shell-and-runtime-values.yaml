affectedRegion: Settings global and section navigation, version and form values, focus/state
  presentation, and runtime interpolation outside the accepted 1440px and 390px endpoint frames.
  This also covers the desktop Paper export's accidental light/white upper-right wedge above the
  dark application canvas, which is not part of the accepted Owner material treatment.
observableProblem: The Settings successor predates the approved shared six-destination Owner
  navigation and shows illustrative version, schedule, focus, and dirty-state values. Reproducing
  those fixtures would detach Settings from the Owner product and overwrite the existing append-only
  settings contract. Its desktop export also contains an isolated light wedge at the upper-right
  edge that visually breaks the otherwise continuous dark shell and has no semantic or compositional
  function.
smallestCorrection: Preserve the accepted Settings page composition exactly, insert the approved
  shared Owner navigation at its established anchor, bind version and editable/locked values to the
  existing settings snapshot and draft state, and use repository responsive/accessibility contracts
  between the Paper desktop and mobile endpoints. Keep the routed upper-right shell on the same
  continuous dark material as the surrounding Owner header instead of reproducing the export
  artifact.
mustPreserve:
  - all five editable axes and all five locked operational timing values
  - clean, dirty, inline validation, saving, saved, and atomic failure semantics
  - append-only versioning, conflict/discard behavior, draft retention, and audit meaning
  - accepted desktop table and mobile day-card compositions
  - bilingual copy, Western digits, 44px targets, reading order, and focus visibility
