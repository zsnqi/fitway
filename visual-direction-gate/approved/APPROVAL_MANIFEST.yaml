approvedDecisions:
  - "Premium first, athletic second, minimal third."
  - "Obsidian, graphite, oxblood, concentrated FITWAY red, chalk text, restrained live green."
  - "Static CSS atmospheric depth and page-level watermark; no canvas, WebGL, RAF, or background animation."
  - "Cairo Arabic/Latin at actual weights 400, 500, 600, and 700."
  - "Public hierarchy: status/freshness, crowd level, approximate count, continuous signal, update time."
  - "One cumulative 28-bar band-derived public crowd instrument with mirrored RTL/LTR progression."
  - "Capacity-free public schema v2: no capacity, denominator, percentage, or person suffix."
  - "Public live/loading/delayed/unavailable/closed/error state grammar."
  - "Canonical widths: 320, 360, 390, 721, 768, 820, 1024, 1200, and 1440."
  - "Public panoramic board; authenticated operational grid; broad analytics curve; purpose-built heatmap; restrained governance."
  - "44px practical targets, visible focus, skip-link focus transfer, dialog discipline, semantic data alternatives."

