# Coordinator-authored derived context template. This file is not an active packet and is not
# authority. Replace every placeholder before a packet becomes READY.
schemaVersion: 1
milestoneId: <milestone-id>
taskClass: repository-infrastructure
packetStatus: DRAFT
stateRef: PROJECT_STATE.yaml#/milestones/<milestone-id>
baseCommit: SELF
task:
  objective: <one bounded observable outcome>
  acceptanceCriteria:
    - <observable result>
  explicitExclusions:
    - <not authorized>
scope:
  ownedPaths:
    - <exact path or bounded pattern>
  forbiddenPaths:
    - <exact path or bounded pattern>
  sharedLeases: []
authorities:
  required:
    - role: workflow
      path: docs/WORKFLOW.md
      selector: { kind: markdown-heading, value: "Roles" }
      reason: <why this task needs it>
  conditional: []
continuity:
  predecessorMilestones: []
  currentHandoff: null
  unresolvedDecisions: []
verification:
  profile: <registered verify phase or explicit focused profile>
  orderedGates:
    - <gate>
  independentReviewRequired: true
evidence:
  receiptTemplate: docs/agent-context/EVIDENCE_RECEIPT_TEMPLATE.md
  requiredArtifacts:
    - <artifact kind/path rule>
# UI/design packets (taskClass ui-maintenance or visual-authority-change) additionally require the
# three objects below. The checker rejects a UI packet without them and requires
# designContextCheck.command to run check:design-context; uncomment and fill them for UI work.
# visual:
#   surfaceKey: <surface key>
#   authorityStatus: ACTIVE | SUPERSEDED | VACANT | UNRESOLVED
#   authorityKey: <register or manifest key>
#   governingDecision: <ADR or decision-record path>
#   currentFrames:
#     - { path: <tracked frame path>, sha256: <64 lowercase hex> }
#   referenceFrames:
#     - { path: <tracked frame path>, sha256: <64 lowercase hex> }
#   openHumanDecisions: []
#   paperAvailability: AVAILABLE | UNAVAILABLE | NOT_APPLICABLE
#   perceptualGate: { status: PASS | PENDING | NOT_REQUIRED | NEEDS_HUMAN, criteria: <what was judged> }
#   promotionGate: { status: PASS | PENDING | NOT_REQUIRED | NEEDS_HUMAN, criteria: <separate approval rule> }
#   acceptanceAuthority: PAPER | MANIFEST | HUMAN_DECISION | NONE
# designContextCheck:
#   command: pnpm check:design-context
#   status: PASS | PENDING | NEEDS_HUMAN
#   artifact: <evidence path or null>
# accessibilityGate: { status: PASS | PENDING | NOT_REQUIRED | NEEDS_HUMAN, criteria: <judgment> }
limitations:
  - <known non-claim>
