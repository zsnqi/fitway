schemaVersion: 1
milestoneId: owner-design-exploration-r04
taskClass: visual-authority-change
packetStatus: READY
stateRef: PROJECT_STATE.yaml#/milestones/owner-design-exploration-r04
baseCommit: e5d5027ab67966c38612dd973f2f4bcb85f3441b
task:
  objective: >-
    Continue user-directed, concept-only Owner design exploration with fresh visual directions.
    Show reviewable directions early, preserve Redline unchanged and unselected, and leave
    production, canonical, Paper, and visual-authority state unchanged.
  acceptanceCriteria:
    - Create fresh Owner whole-page direction artifacts under the owned directions path, each with a named visual world and clear first-glance thesis; no fixed direction count or prescribed visual form.
    - Keep red and black as the broad FITWAY identity anchor and avoid Cairo in these concepts; exact shades, light/dark treatment, typography, materials, composition, and chart form remain open.
    - Use synthetic data and preserve shipped behavior, product semantics, truthful states, privacy, security, accessibility, Western digits, and Arabic RTL / English LTR.
    - Render and personally inspect exact English and Arabic desktop 1440x900 and mobile 390x844 frames for each direction presented; record the frames and reviewer, and disclose any unrun 320px, 200% reflow, keyboard, reduced-motion, and independent perceptual checks.
    - Present the direction artifacts for the user's steer or choice without implying selection. Keep Redline and its evidence unchanged and unselected.
    - Keep the Owner composition authority vacant and production/canonical/Paper state unchanged.
  explicitExclusions:
    - Production UI, CSS, copy, hooks, routes, i18n, dependencies, schemas, APIs, and data semantics.
    - Selecting a direction, declaring visual acceptance, or promoting any concept on the user's behalf.
    - Canonical, Paper, manifest, token-baseline, authority-register, approval-hash, or production promotion changes.
    - Reworking Redline or copying prior r02, r03, or Redline composition, material, or tokens into a direction presented as fresh.
scope:
  ownedPaths:
    - design-research/owner-composition-exploration-r04/directions/**
    - docs/phase-records/handoffs/owner-design-exploration/20260923-165000-owner-design-exploration-r04-activation.md
    - docs/phase-records/handoffs/owner-design-exploration/r04/**
    - docs/phase-records/task-packets/owner-design-exploration-r04.yaml
    - SPEC.md
    - biome.json
    - CLAUDE.md
    - .claude/agents/**
    - .claude/skills/**
  forbiddenPaths:
    - design-research/owner-composition-exploration-r01/**, design-research/owner-composition-exploration-r02/**, and design-research/owner-composition-exploration-r03/** (preserved diagnostic evidence)
    - design-research/owner-visual-preferences/** (user-supplied reference; read only)
    - design-research/owner-composition-exploration-r04/concept/** and design-research/owner-composition-exploration-r04/README.md (preserve Redline and its evidence)
    - apps/** and packages/** production code, copy, behavior, and data semantics
    - tests/browser/** including canonicals and screenshots
    - visual-direction-gate/**, docs/design/VISUAL_AUTHORITY_STATUS.md, docs/design/PAPER_GUIDE_CONFLICT_MAP.md, docs/adr/**, approval manifests, and pinned hashes
    - PROJECT_STATE.yaml and PROJECT_STATE_HISTORY.yaml (coordinator only)
    - FITWAY_PRODUCT.md, DESIGN_GUIDE.md, DESIGN.md, and docs/WORKFLOW.md (policy clarification committed; no concept-stage edits), and all of SPEC.md except the user-authorized 2026-09-24 entries-framing wording
    - docs/archive/**, prior handoffs, and unrelated phase records
    - pnpm-lock.yaml, dependencies, and migrations
  sharedLeases: []
authorities:
  required:
    - role: product
      path: FITWAY_PRODUCT.md
      selector: { kind: markdown-heading, value: "Approved visual baseline" }
      reason: Distinguish the production baseline from the human-authorized concept-only Owner exploration.
    - role: product
      path: RESEARCH.md
      selector: { kind: markdown-heading, value: "2. Product Anchor & Business Context" }
      reason: "Product context only: identify the pilot gym and Owner use cases; this research is not visual authority."
    - role: spec
      path: SPEC.md
      selector: { kind: markdown-heading, value: "Implementation authority and fidelity contract" }
      reason: Preserve security, privacy, accessibility, bilingual behavior, and data contracts.
    - role: design
      path: DESIGN_GUIDE.md
      selector: { kind: markdown-heading, value: "1. Direction" }
      reason: Read the production appearance baseline with the current Owner exploration exception.
    - role: design
      path: DESIGN_GUIDE.md
      selector: { kind: markdown-heading, value: "3. Color and surfaces" }
      reason: Retain semantic color, contrast, and production context without locking concept colors or materials.
    - role: design
      path: DESIGN_GUIDE.md
      selector: { kind: markdown-heading, value: "4. Typography and numerals" }
      reason: Keep locale and numeral behavior while allowing non-Cairo concept typography.
    - role: design
      path: DESIGN_GUIDE.md
      selector: { kind: markdown-heading, value: "12. Data visualization" }
      reason: Preserve truthful data, states, and accessible equivalents while allowing any chart form.
    - role: design
      path: DESIGN_GUIDE.md
      selector: { kind: markdown-heading, value: "15. Phase visual gate" }
      reason: Preserve responsive, RTL/LTR, typography, accessibility, motion, and visual-gate rules.
    - role: design
      path: DESIGN.md
      selector: { kind: markdown-heading, value: "Exploration mode" }
      reason: Route Impeccable through the FITWAY exploration envelope without making this router authority.
    - role: visual-status
      path: docs/design/VISUAL_AUTHORITY_STATUS.md
      selector: { kind: markdown-heading, value: "Register" }
      reason: Confirm Owner composition authority remains vacant and other surfaces remain unaffected.
    - role: adr
      path: docs/adr/ADR-007-paper-visual-source-of-truth.md
      selector: { kind: markdown-heading, value: "Authority split" }
      reason: Preserve the Paper versus repository boundary where applicable.
    - role: adr
      path: docs/adr/ADR-009-owner-composition-authority-supersession.md
      selector: { kind: markdown-heading, value: "Decision" }
      reason: Owner composition is vacant; prior Owner compositions are provenance only.
    - role: workflow
      path: docs/WORKFLOW.md
      selector: { kind: markdown-heading, value: "Design work: authority, concepts, and perceptual gates" }
      reason: Follow concept, perceptual, accessibility, review, and human decision gates.
    - role: test
      path: scripts/verify-repository.mjs
      selector: { kind: whole-file, value: "" }
      reason: Preserve repository state and artifact invariants.
  conditional:
    - trigger: the route or surface is Owner
      role: adr
      path: docs/adr/ADR-009-owner-composition-authority-supersession.md
      selector: { kind: markdown-heading, value: "Decision" }
      actionIfTriggered: READ
    - trigger: Paper is unavailable and composition depends on it
      role: visual-status
      path: docs/design/PAPER_GUIDE_CONFLICT_MAP.md
      selector: { kind: whole-file, value: "" }
      actionIfTriggered: NEEDS_HUMAN
continuity:
  predecessorMilestones:
    - owner-design-exploration-r03
  currentHandoff: docs/phase-records/handoffs/owner-design-exploration/r04/20261004-154306-owner-design-exploration-r04-resume.md
  unresolvedDecisions:
    - The user has requested fresh visual directions and plans to use Opus 5.5, but has not chosen a direction, style, or attempt count.
    - Owner composition authority remains vacant until the user selects a concept and it passes the explicit perceptual and authority-promotion gates.
    - Any production baseline departure or canonical promotion requires a separate explicit human decision.
verification:
  profile: fresh concept-only Owner visual directions; no production or promotion verification
  orderedGates:
    - Validate the READY packet and ledger with context:show and check:agent-context, then read the ordered routed sources.
    - Run check:design-context in the authorized host and choose Browser for interaction plus repository Playwright for repeatable concept captures before opening a page.
    - Produce fresh concept-only directions from the brief without copying Redline or rejected work; keep each artifact self-contained and synthetic.
    - Render and personally inspect exact EN/AR desktop and mobile frames before presenting any direction as reviewable; identify frames, states, and reviewer.
    - Check truthful loading, live, delayed, missing, closed, and future states where shown; inspect keyboard/focus, reduced motion, and chart text equivalents for the chosen concept depth.
    - Before VALIDATING or DONE, complete 320px/200% reflow, accessibility, independent perceptual review, and the WORKFLOW concept gate; a presentation made earlier is explicitly exploratory.
    - Record the user's choose, revise, request-more, or pause decision without implying approval or production promotion.
  independentReviewRequired: true
evidence:
  receiptTemplate: docs/agent-context/EVIDENCE_RECEIPT_TEMPLATE.md
  requiredArtifacts:
    - Exact context:show and check:agent-context results with packet SHA-256.
    - Impeccable design-context PASS from the authorized host context.
    - Each new direction's artifact, named world/thesis, synthetic-data note, and exact EN/AR desktop/mobile rendered frames personally inspected.
    - The user's explicit decision or a recorded pending decision; no implied selection.
    - Confirmation that Redline remains unchanged and unselected and that production/canonical/Paper/authority state is unchanged.
limitations:
  - This packet authorizes fresh concept artifacts only. Redline remains intact and unselected; no new direction is preselected or prescribed by the coordinator.
  - Red and black are the broad identity anchor and Cairo is excluded from these concepts. The user has not fixed a direction count, layout, shade, light/dark treatment, material, atmosphere, chart form, or typography beyond that exclusion.
  - Product/Spec behavior, data semantics, privacy, security, accessibility, Western digits, and RTL/LTR remain binding. Production and canonical state do not change.
  - The required reference-frame entry is historical provenance only; it is not a preferred style or required chart treatment. Existing Owner screenshots and Paper exports are not composition authority.
  - On 2026-09-24 the user authorized one SPEC.md amendment. The Owner entries figure no longer requires the "estimated entrance crossings, not unique members" caption, because the owner will explain the measure directly. The figure must still be named as entries and never as members or unique visitors. No other SPEC.md text changes in this packet.
  - On 2026-09-25 the user authorized one biome.json change. It excludes `design-research/owner-composition-exploration-r04/directions` from Biome, both formatter and linter, mirroring the existing r01 `_quarantine` exclusion. The reason is that the concept scripts are exploration code, not production, and can then be committed exactly as captured. Rewriting them would touch protected directions and invalidate their evidence. No other biome.json change is made in this packet.
  - On 2026-09-25 the user authorized continuing this milestone in Claude Code cloud sessions, which see only committed files. They therefore authorized tracking `.claude/agents/` and `.claude/skills/`. `.claude/agents/` holds the four Owner-direction agent definitions with fixed effort levels, and Impeccable's four shipped agents. `.claude/skills/` holds copies of the skills this work uses, namely Impeccable 4.3.1 (Apache-2.0) and ux-araby (MIT), with their licences and `.claude/skills/SOURCES.md`. They also authorized one CLAUDE.md change, in its "Repository-local Claude configuration" section. That section now states what is tracked and gives the rule for choosing a definition by effort; the rest of `.claude/` stays untracked and nothing in it is normative. The Impeccable engine binary is not vendored. No other CLAUDE.md or `.claude/` change is made in this packet.
  - On 2026-09-25 the user authorized a second biome.json change, which adds `!**/.claude/skills` to the Biome includes. Before it, the pre-commit Biome hook linted the vendored skill code as project code and failed. It also rewrote seven vendored files, which were restored to their exact originals. Vendored skills stay copies of their upstream sources. The only exception is trailing whitespace removed from four Markdown files (27 lines), so that the repository's `git diff --check` invariant passes; this is recorded in `.claude/skills/SOURCES.md`. No other biome.json change is made in this packet.
  - On 2026-10-02 the user authorized replacing CLAUDE.md's model guidance with an effort-first rule and adding the
    `sonnet-researcher` (Sonnet, high) and `sonnet-scout` (Sonnet, medium) definitions to `.claude/agents/`. The same
    day the milestone moved to short resume points under `docs/phase-records/handoffs/owner-design-exploration/r04/`,
    with its standing decisions in `DECISIONS.md` there; the activation log is frozen history.
visual:
  surfaceKey: owner-composition-family
  authorityStatus: VACANT
  authorityKey: ADR-009
  governingDecision: docs/adr/ADR-009-owner-composition-authority-supersession.md#decision
  explorationEnvelope:
    mode: EXPLORATION
    lockedAxes:
      - FITWAY identity expressed through red and black as the broad theme; exact shades, ratios, and semantic color assignments are open.
      - Product/Spec behavior and content semantics, estimated occupancy truth, privacy, security, accessibility, Western digits, and Arabic RTL / English LTR.
      - Production theme, tokens, Cairo typography, and production atmosphere remain unchanged; they are not mandatory recipes for concept-only Owner exploration.
    variableAxes:
      - All visual choices for Owner concepts, including composition, information order, density, navigation, typography, color roles and shades, light/dark treatment, surface depth, materials, atmosphere, gradients, glow, motion, and chart form.
      - Interaction and chart treatments, provided their data, state distinctions, accessibility, locale behavior, and reduced-motion behavior remain truthful and operable.
    requiredDepartures:
      - A direction presented as fresh must have a distinct whole-page world and consequential hierarchy or composition choices; no specific visual treatment is required.
    antiRuts:
      - Redline and its frames are unselected prior work; fresh directions derive from the brief without copying their composition, material, or tokens.
      - Rejected r02 and r03 concepts remain diagnostic history; none is current composition authority.
      - Superseded Owner Paper frames and canonicals are not composition authority. Public and Staff compositions are not Owner references.
    promotionRule: >-
      This exploration selects, validates, or promotes no concept on the user's behalf. The user
      directs the number and revisions. Any production change requires separate human selection,
      baseline approval, and perceptual gate.
    authorizingDecision: docs/phase-records/handoffs/owner-design-exploration/20260923-165000-owner-design-exploration-r04-activation.md
  currentFrames:
    - path: tests/browser/__screenshots__/win32/chromium/phase9-owner-ui.browser.spec.ts/owner-daily-route-ar-desktop-1440x900.png
      sha256: 1c3dfc4006df48252f69e707e7619d7e8460810525668f26ef8afd1120f07d89
    - path: tests/browser/__screenshots__/win32/chromium/phase9-owner-ui.browser.spec.ts/owner-daily-route-en-mobile-390x844.png
      sha256: b43131097456b32e92b61226eb91fde796a1ecd05989f82830cfd19fab0ae67d
  referenceFrames:
    - path: design-research/owner-visual-preferences/20260923-smooth-red-line-reference.png
      sha256: e50627e0d5218adbd9c00f712b07ff6c13c00dfd2386b4b6a6c57be7de8c132e
  openHumanDecisions:
    - Redline remains unselected. The user requests fresh visual directions and will steer or choose after seeing them.
    - No attempt count or visual style is prescribed beyond the broad red-and-black identity and non-Cairo concept type.
    - Owner composition authority remains vacant under ADR-009 until a concept is explicitly selected and promoted.
    - Production and canonical promotion require separate explicit human approval.
  paperAvailability: UNAVAILABLE
  perceptualGate:
    status: PENDING
    criteria: Exact rendered EN/AR desktop/mobile concept frames and an independent perceptual judgment remain pending before VALIDATING or DONE.
  promotionGate:
    status: NOT_REQUIRED
    criteria: This early concept changes no canonical or production baseline; promotion is a separate serialized human decision.
  acceptanceAuthority: NONE
designContextCheck:
  command: pnpm check:design-context
  status: PASS
  artifact: docs/phase-records/handoffs/owner-design-exploration/20260923-165000-owner-design-exploration-r04-activation.md
accessibilityGate:
  status: PENDING
  criteria: Review RTL/LTR, 320px and 200% reflow, keyboard/focus, reduced motion, truthful states, and chart equivalents before VALIDATING.
