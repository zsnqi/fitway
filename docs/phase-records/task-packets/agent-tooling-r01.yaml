schemaVersion: 1
milestoneId: agent-tooling-r01
taskClass: repository-infrastructure
packetStatus: READY
stateRef: PROJECT_STATE.yaml#/milestones/agent-tooling-r01
task:
  objective: >-
    Own and improve the agent tooling that owner-design-exploration-r04 held: one CLI contract with a generated
    tools listing, a generated code map with a drift check, a lighter pickup, map upkeep, and the open launcher and
    verify-fitway findings, so agents and Codex rounds work from clearer, cheaper, checked tools.
  acceptanceCriteria:
    - "Route (F253): the tool paths owner-design-exploration-r04 held are owned here, and r04 keeps the concept; both ledger entries record the move."
    - "One CLI contract (F251): every agent-facing command answers --help with usage and exit 0, refuses an unknown option by name with exit 1, prints failures as '<command>: FAIL: <what> (<how to fix>)', and documents its exit codes; a shared contract test enforces it over every registered command; 'pnpm tools' prints the commands from one registry, and the test fails when a package.json script that runs a registered tool is missing from it."
    - "A generated code map of the agent-facing scripts and skills: each file's main functions with their lines and the tests that cover them, regenerated by one command and drift-checked in the fast ladder."
    - "Lighter pickup: a short standing-rules file read at startup, with the decisions files read through pointers; a packet can name a command (pnpm check:repository) in place of a whole-file read of scripts/verify-repository.mjs; the start load measured with pnpm start-load before and after."
    - "Map upkeep (F252): the verification map's drift check fails, or prints a visible skip that the ladder reports, wherever it checks nothing; README's documentation map is checked beyond existence; one gardener pass is recorded."
    - "Code quality (DECISIONS item 6): every implementing round's diff gets docs/agent-context/briefs/CODE_REVIEW.md's review before it merges, its blocking findings fixed first; a ratchet in the fast ladder holds per-file counts of duplicate blocks, type and lint escapes, suppressions and repeated workarounds over the tooling, apps/ and packages/, fails when a change raises one in a file it touches or grows a file already over the giant-file size, and is proven to fail on a real past case; the code map marks callables carrying counted debt or an open finding as do-not-copy, and the gardener's pass runs unblocked with apps/ and packages/ in its scope."
    - "The open launcher and verify-fitway findings this milestone takes (F254 first; then F241's tool side, F248, F146, F180 and the F184-F233 code-shape flags where a round already touches their code) are each fixed with a check proven to fail on the real past case, or recorded with a reason."
  explicitExclusions:
    - Product code, copy, behavior and data semantics (apps/**, packages/**, edge/** and their tests), dependencies and migrations.
    - The Owner concept and its recipes on the build branch (design-research/**), which stay with owner-design-exploration-r04.
    - Locked product, security, privacy, content, accessibility, visual-authority and data-semantic decisions (AGENTS.md).
    - Acceptance thresholds, held-out rows and the grader (D:/fitway-grader), which never enter the repository or a brief.
    - CLAUDE.md and .claude/**, which change only on the user's word.
authorities:
  required:
    - role: workflow
      path: docs/WORKFLOW.md
      selector: { kind: markdown-heading, value: "Roles" }
      reason: Preserve coordinator, worker, and verifier ownership.
    - role: contract
      path: docs/schemas/project-state.schema.json
      selector: { kind: json-pointer, value: "/properties/milestones" }
      reason: Inspect current state invariants before additive infrastructure work.
    - role: test
      path: scripts/verify-repository.mjs
      selector: { kind: whole-file, value: "" }
      reason: Keep the repository ladder and mutation guards intact.
  conditional:
    - trigger: the infrastructure can affect a Product or Spec guarantee
      role: product
      path: FITWAY_PRODUCT.md
      selector: { kind: markdown-heading, value: "Canonical detail" }
      actionIfTriggered: READ
    - trigger: the infrastructure changes a design-context bridge
      role: design
      path: DESIGN.md
      selector: { kind: markdown-heading, value: "Design" }
      actionIfTriggered: READ
continuity:
  predecessorMilestones:
    - agent-environment-r03
  unresolvedDecisions: []
verification:
  profile: focused repository-infrastructure profile; unit tests for touched scripts, check:repository, check:agent-context, Biome, CI on the branch; held-out grading of each Codex round
  orderedGates:
    - Validate the READY packet and ledger with context:show and check:agent-context.
    - Write each Codex round's held-out rows outside the repository before its launch; grade every implementing round on them and reproduce at least one row before using a verdict (two when a DeepSeek grader grades a DeepSeek round).
    - Add or update unit tests for every touched script and run them with scripts/run-vitest.mjs; CI passes on the branch.
    - Run check:repository, check:agent-context and Biome on the changed files; git status must be unchanged by the runs.
    - Independent verification against this packet's acceptance criteria before integration.
  independentReviewRequired: true
evidence:
  requiredArtifacts:
    - The CLI contract test and the generated tools listing, with the commands it covers.
    - The code map, the command that regenerates it, and its drift check's result in the ladder.
    - The start load before and after the lighter pickup, from pnpm start-load.
    - Each Codex round's brief rows, held-out rows and failure cause, in codex-rounds.md.
    - Exact unit-test and check:repository results, and the green CI run on the branch's pushed commit.
    - The independent verifier's report.
limitations:
  - Opened by the coordinator on 2026-10-16 under owner-design-exploration-r04 DECISIONS item 73 (the user's word, 2026-10-16), which moves the tool paths r04 held from agent-environment-r03 here (F253).
  - package.json is leased for its scripts section only; any dependency change is out of scope.
  - The findings table and the Codex round records stay where they are (docs/phase-records/handoffs/agent-environment/findings.tsv and rounds.tsv, owner-design-exploration-r04's codex-rounds.md); the coordinator keeps them for both milestones.
  - The live Owner concept is on owner-followup-r04-build, not on this branch, so the verification map's drift check reads it there.
