# Coordinator-authored derived context. Not authority. DRAFT while the milestone is PLANNED;
# it authorizes no work until the coordinator activates the milestone and marks the packet READY.
schemaVersion: 1
milestoneId: owner-design-exploration-r01
taskClass: visual-authority-change
packetStatus: DRAFT
stateRef: PROJECT_STATE.yaml#/milestones/owner-design-exploration-r01
baseCommit: SELF
task:
  objective: >-
    After the standing design-environment audit gate is resolved, produce and judge two or three
    whole-page Owner direction alternatives (composition and visual treatment) inside the recorded
    exploration envelope for the seven ADR-009 surfaces, with no production implementation, no
    canonical or visual-authority change, and explicit human approval of the selected concept as a
    separate decision.
  acceptanceCriteria:
    - The standing environment-audit gate is resolved by a recorded PASS or a recorded human decision superseding it before any concept work starts.
    - Two or three whole-page Owner direction alternatives exist as inspectable concept artifacts for the ADR-009 surface family, each naming its own visual world and stating which envelope axes it varies; no two share a world.
    - At least one alternative deliberately departs the incumbent near-black/oxblood/FITWAY-red atmosphere (it may be non-dark and non-red), every artifact is labeled concept-only, and no alternative is a layout-only restyle of the incumbent.
    - Each alternative is judged against the full concept-selection gate — spatial thesis, first-glance focal hierarchy, grouping and reading order, vertical and horizontal rhythm, density and intentional whitespace, separation of governance/controls/actions/data, and behavior at 1440px, mobile 390x844, 320px/200% reflow, EN, and AR — and the set is judged for direction distinctness from side-by-side full-resolution rendered frames.
    - The judged selection is presented to the human for explicit concept approval, and the record names the exact inspected frames with paths and hashes.
    - No production UI, copy, behavior, canonical, Paper, manifest, register, ADR, or authority change occurs.
  explicitExclusions:
    - Any production UI, CSS, copy, hook, route, i18n, dependency, schema, API, or data-semantics change under apps/**, packages/**, or tests/**.
    - Any canonical, Paper, manifest, approval-hash, register, ADR, or visual-authority change; canonical promotion remains a separate serialized human action.
    - Any Public, Staff, or Login composition change (ADR-009 decisions 4-5).
    - Any use of the superseded Owner compositions, canonicals, or the frozen owner-governance-layout-recomposition-r02 candidate as acceptance authority or as a reason to reject a concept.
    - Any semantic composition primitives; they remain deferred until after concept selection (ADR-009 consequences).
    - "Any assumption that an exploration departure is implementable: production identity stays locked until a separate explicit human baseline decision."
scope:
  ownedPaths:
    - design-research/owner-composition-exploration-r01/** (concept input and artifacts; not authority)
    - docs/phase-records/handoffs/owner-design-exploration/** (milestone handoffs and records)
    - docs/phase-records/task-packets/owner-design-exploration-r01.yaml and PROJECT_STATE.yaml (coordinator state only)
  forbiddenPaths:
    - apps/** and packages/** production code, copy, behavior, and data semantics
    - tests/browser/** including every screenshot and canonical
    - visual-direction-gate/**, docs/design/VISUAL_AUTHORITY_STATUS.md, docs/design/PAPER_GUIDE_CONFLICT_MAP.md, docs/adr/**, approval manifests, and pinned hashes
    - PROJECT_STATE_HISTORY.yaml, docs/archive/**, prior handoffs, and phase records
    - pnpm-lock.yaml, dependency versions, and database schema or migrations
  sharedLeases:
    - Coordinator-exclusive PROJECT_STATE.yaml, this packet, and owner-design-exploration handoff surfaces for owner-design-exploration-r01
authorities:
  required:
    - role: product
      path: FITWAY_PRODUCT.md
      selector: { kind: markdown-heading, value: "Approved visual baseline" }
      reason: Retain FITWAY identity and locked semantics while the Owner composition is redesigned.
    - role: spec
      path: SPEC.md
      selector: { kind: markdown-heading, value: "Implementation authority and fidelity contract" }
      reason: Preserve product, accessibility, and data constraints in every concept.
    - role: design
      path: DESIGN_GUIDE.md
      selector: { kind: markdown-heading, value: "15. Phase visual gate" }
      reason: Use the visual gate and responsive contract that any accepted concept must satisfy.
    - role: design
      path: DESIGN.md
      selector: { kind: markdown-heading, value: "Exploration mode" }
      reason: Route the design skill to the exploration-mode clause instead of incumbent inheritance.
    - role: visual-status
      path: docs/design/VISUAL_AUTHORITY_STATUS.md
      selector: { kind: markdown-heading, value: "Register" }
      reason: Resolve the seven Owner surfaces' vacant composition status under ADR-009.
    - role: adr
      path: docs/adr/ADR-007-paper-visual-source-of-truth.md
      selector: { kind: markdown-heading, value: "Authority split" }
      reason: Paper remains the visual source of truth for every surface where no supersession is recorded.
    - role: workflow
      path: docs/WORKFLOW.md
      selector: { kind: markdown-heading, value: "Design work: authority, concepts, and perceptual gates" }
      reason: Run the concept, perceptual, and promotion gates exactly as written.
    - role: test
      path: scripts/verify-repository.mjs
      selector: { kind: whole-file, value: "" }
      reason: Preserve repository invariants, authority pins, and artifact hashes while exploring.
    - role: adr
      path: docs/adr/ADR-009-owner-composition-authority-supersession.md
      selector: { kind: markdown-heading, value: "Decision" }
      reason: Owner composition authority is vacant under this binding human decision; the redesign runs only through its gates.
    - role: design
      path: docs/design/OWNER_COMPOSITION_REDESIGN_READINESS.md
      selector: { kind: whole-file, value: "" }
      reason: Recorded redesign inputs and the deferred-primitives boundary; a derived view, not authority.
  conditional:
    - trigger: the route or surface is Owner
      role: adr
      path: docs/adr/ADR-009-owner-composition-authority-supersession.md
      selector: { kind: markdown-heading, value: "Decision" }
      actionIfTriggered: READ
    - trigger: Paper is unavailable and composition depends on it
      role: visual-status
      path: docs/design/PAPER_GUIDE_CONFLICT_MAP.md
      selector: { kind: whole-file, value: "" }
      actionIfTriggered: NEEDS_HUMAN
continuity:
  predecessorMilestones: []
  currentHandoff: docs/phase-records/handoffs/owner-design-exploration/20260920-205114-owner-design-exploration-r01-opening.md
  unresolvedDecisions:
    - "Standing gate: no fresh independent audit of the repaired design-agent environment has a recorded PASS (r01-r08 chain ended FAILED_VALIDATION; the phase3 test-reliability successor recorded no verdict). Resolution must precede any concept work."
    - "Human concept approval of the selected whole-page alternative is required before any implementation or promotion."
    - "Promotion of any exploration departure from a locked production visual rule requires a separate explicit human baseline decision with its own perceptual gate."
    - "Live Paper tool exposure is unresolved; a composition decision that depends on it stops at NEEDS_HUMAN."
verification:
  profile: design exploration (concepts only); context checks plus the concept-selection gate, no production verification ladder while code is out of scope
  orderedGates:
    - bounded context:show continuity and repository-wide check:agent-context validation of this packet, state, scope, and frame hashes
    - pnpm check:design-context at design-session entry
    - standing environment-audit gate resolved (recorded PASS or recorded human supersession)
    - concept alternatives produced and judged through the full concept-selection gate, including EN/AR, mobile, 1440px, and 320px/200% behavior
    - accessibility review of the selected concept against the DESIGN_GUIDE accessibility baseline and SPEC acceptance criteria
    - exact concept frames and the concept-gate judgment recorded with paths and hashes
    - human concept approval before any implementation milestone; canonical promotion remains separate and serialized
  independentReviewRequired: true
evidence:
  receiptTemplate: docs/agent-context/EVIDENCE_RECEIPT_TEMPLATE.md
  requiredArtifacts:
    - exact context:show and check:agent-context outputs and the packet SHA-256
    - the standing environment-audit resolution record
    - concept artifacts with exact paths and SHA-256 hashes
    - the concept-gate judgment naming its criteria and the frames inspected
    - the human concept decision record
limitations:
  - This packet is DRAFT while the milestone is PLANNED; it authorizes no work until the coordinator activates the milestone and marks the packet READY.
  - Live Paper tool exposure was not re-probed at opening; the 2026-09-15 register records it as not exposed, and stored exports and canonicals are provenance only.
  - The design-context check passed in this opening worktree on 2026-09-20; the required per-session entry check must be re-run when the design session starts.
  - This packet makes no Product, Spec, accessibility, data, privacy, or visual-acceptance claim.
  - Exploration-envelope departures are concept-only; the packet authorizes no production styling from a departing concept, and any promotion requires the separate human baseline decision.
visual:
  surfaceKey: owner-composition-family
  authorityStatus: VACANT
  authorityKey: ADR-009
  governingDecision: docs/adr/ADR-009-owner-composition-authority-supersession.md#decision
  explorationEnvelope:
    mode: EXPLORATION
    lockedAxes:
      - "FITWAY identity: Arabic-first RTL with English LTR, Cairo 400-700, Western digits, and locked copy."
      - "Security, privacy, data semantics, accessibility baseline, and all non-visual Product/Spec contracts."
      - "Production stays dark-only: v1 ships no light theme or theme toggle, and the --fw-* production baseline is unchanged until a successor human baseline decision."
    variableAxes:
      - "Color strategy and atmosphere inside exploration artifacts: alternatives may leave the incumbent near-black/graphite + oxblood + FITWAY-red treatment, including non-dark and non-red worlds."
      - "Surface and material language, density and rhythm, type voice, chart treatment, motion character, and navigation/composition model."
    requiredDepartures:
      - "At least one whole-page alternative must deliberately depart the incumbent atmosphere rather than restyle it; no two alternatives may share the same named visual world."
    antiRuts:
      - "The incumbent near-black/graphite + oxblood glow atmosphere and its production radial-gradient recipes."
      - "The quarantined pre-envelope attempts (concept-a-command-rail, concept-b-briefing-dossier, concept-c-strata, concept-d-owner-desk)."
      - "Defaulting to the frozen owner-governance-layout-recomposition-r02 topology described in OWNER_COMPOSITION_REDESIGN_READINESS.md; it is provenance only and must not constrain the redesign."
      - "A restyle that keeps the incumbent palette, material, and atmosphere and changes only layout."
    promotionRule: >-
      A concept that departs from a locked production visual rule reaches production only through a
      separate explicit human baseline decision with its own perceptual gate; this envelope, a
      concept-selection record, or a green check never promotes a departure.
    authorizingDecision: docs/phase-records/handoffs/owner-design-exploration-envelope-repair-r01/20260921-183100-exploration-envelope-decision.md
