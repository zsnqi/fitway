# Closed r03 context: all concepts rejected; historical evidence only, not a future design instruction.
schemaVersion: 1
milestoneId: owner-design-exploration-r03
taskClass: visual-authority-change
packetStatus: CLOSED
stateRef: PROJECT_STATE.yaml#/milestones/owner-design-exploration-r03
baseCommit: 4a8c01e3b5b6bcc137876bb55fb5d62fca4637bb
task:
  objective: >-
    Prepare four genuinely distinct, interactive Owner redesign concept slices for an early
    human comparison, preserving FITWAY's current dark and glass character in spirit while
    rethinking composition, hierarchy, icons, charts, color roles, and motion.
  acceptanceCriteria:
    - Four independently conceived directions each show shared navigation, a truthful Daily opening and chart, and a dense Reports or Activity Log surface.
    - Each direction renders exact EN/AR 1440x900 desktop and 390x844 mobile frames and demonstrates section navigation, chart or detail interaction, control feedback, and reduced-motion behavior.
    - Each direction explains its distinct spatial and interaction thesis, icon/color system, and concise extension to Access, Operations, and Settings.
    - The coordinator personally inspects exact rendered frames and interaction, compares the four with the running Owner UI, and presents an early side-by-side taste gate for the user's choose, revise, or reject decision.
    - Product, Spec, security, privacy, data truth, accessibility, RTL/LTR, Western digits, and production dark-only rules remain binding; concepts are labeled exploration only.
  explicitExclusions:
    - Production UI, CSS, copy, hooks, routes, i18n, dependencies, schemas, APIs, and data semantics.
    - Selecting a direction on behalf of the user or extending one to the complete seven-surface implementation before the human taste decision.
    - Canonical, Paper, manifest, token-baseline, authority-register, ADR, approval-hash, or production promotion changes.
    - Reusing the four rejected r02 concepts, earlier rejected prototypes, Public or Staff compositions, or superseded Owner Paper frames as future visual references.
