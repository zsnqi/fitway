verification:
  profile: four-direction Owner concept comparison; no production or promotion verification
  orderedGates:
    - Validate the READY packet and ledger with context:show and check:agent-context, then read ordered routed sources.
    - Record the allowed rendering route; inspect Browser or Playwright instructions before opening a page.
    - Inspect the running Owner UI interaction and animation in the disposable synthetic demo; avoid storing credentials in tracked records.
    - Give independent concept writers disjoint paths and separate worktrees; isolate runtime resources and integrate serially.
    - Inspect every direction's exact EN/AR desktop/mobile frames, functional interactions, reduced-motion behavior, and current-UI comparison personally.
    - Check 320px and 200% reflow, keyboard and focus, truthful loading/stale/closed/error semantics, accessibility, and distinctness before the human comparison.
    - Obtain independent perceptual and accessibility review before VALIDATING; ask the user to choose, revise, or reject at the early taste gate.
  independentReviewRequired: true
