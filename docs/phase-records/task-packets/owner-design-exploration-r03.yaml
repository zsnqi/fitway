  - The current runtime inspection must be refreshed; ignored demo frames from the prior session may be absent in another worktree.
visual:
  surfaceKey: owner-composition-family
  authorityStatus: VACANT
  authorityKey: ADR-009
  governingDecision: docs/adr/ADR-009-owner-composition-authority-supersession.md#decision
  explorationEnvelope:
    mode: EXPLORATION
    lockedAxes:
      - FITWAY identity, Arabic-first RTL and English LTR, Western digits, and Product/Spec semantics.
      - Security, privacy, data truth, accessibility, and all non-visual Product/Spec contracts.
      - Production remains dark-only with the current --fw-* baseline, Cairo actual weights 400/500/600/700, and static-atmosphere rules until separately approved.
    variableAxes:
      - Owner concept composition, content order, navigation, material depth, panel geometry, density, rhythm, chart grammar, and form grouping.
      - Icon family and semantic color roles, purposeful orientation and feedback motion, with reduced-motion handling.
      - Supporting colors and lighter breathing room within a recognizably dark FITWAY character.
    requiredDepartures:
      - Four directions must have distinct observable spatial and interaction theses, page skeletons, and chart treatments.
      - Each direction must meaningfully redesign hierarchy, icon and color coherence, and motion rather than merely polish or rearrange the current UI.
    antiRuts:
      - All four rejected r02 directions and earlier rejected concepts; their geometry, palette, chart, and ordering are diagnostic evidence only.
      - Superseded Owner Paper frames and canonicals, Public and Staff compositions, and frozen candidates are not future Owner visual references.
      - The incumbent Owner layout, metric stacking, clipped mobile navigation, and near-absent motion are problems to solve, not topology to preserve.
    promotionRule: >-
      Human concept choice precedes full seven-surface work; any locked production visual
      departure then needs a separate explicit human baseline decision and perceptual gate.
      This concept packet, green checks, and prior frames promote nothing.
    authorizingDecision: docs/phase-records/handoffs/owner-design-exploration/20260923-123000-owner-design-exploration-r03-activation.md
